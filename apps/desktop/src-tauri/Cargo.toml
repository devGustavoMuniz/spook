[package]
name = "spook-desktop"
version = "0.1.0"
description = "Spook desktop (casca Tauri 2)"
authors = ["Dotta Digital"]
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "spook_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Chaveiro do SO: Keychain (macOS), Credential Manager (Windows) e Secret Service (Linux, via libdbus).
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
