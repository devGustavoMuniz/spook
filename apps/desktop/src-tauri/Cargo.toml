[package]
name = "spook-desktop"
version = "0.1.11"
description = "Spook desktop (casca Tauri 2)"
authors = ["Dotta Digital"]
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "spook_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["camera", "deepfilter"]
# Câmera nativa (nokhwa: AVFoundation, Media Foundation, V4L2). Isolada porque os backends de câmera são o
# ponto mais frágil da build; sem a feature, `voice_set_camera_enabled(true)` responde "não suportado".
camera = ["dep:nokhwa", "dep:image"]
# Supressão de ruído "Máximo" (DeepFilterNet3 por inferência `tract`, em Rust puro, modelo ONNX de ~8 MB embutido).
# Isolada porque puxa ~55 crates (tract, ndarray...) e deixa o binário maior; sem a feature, o nível "max" responde
# "indisponível" e o RNNoise (Forte) cobre. Ver SPEC 5.5, "Adicional: supressão de ruído DeepFilterNet".
deepfilter = ["dep:deep_filter", "dep:ndarray"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon`: bandeja do sistema (menu "Abrir Spook"/"Sair", fechar para a bandeja).
tauri = { version = "2", features = ["tray-icon"] }
# Com `deep-link`, abrir `spook://...` com o app já rodando (Windows/Linux) entrega a URL à instância existente.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Esquema `spook://` (login pelo navegador): registro no instalador (tauri.conf.json) e em runtime (Windows/Linux).
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
# Início com o sistema (macOS: Launch Agent; Windows: Run do registro; Linux: .desktop em autostart). Padrão desligado.
tauri-plugin-autostart = "2"
# Atualização automática (assinada): consulta o latest.json do release do GitHub; reiniciar usa o plugin de processo.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Chaveiro do SO: Keychain (macOS), Credential Manager (Windows) e Secret Service (Linux, via libdbus).
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }

# Voz, vídeo e tela nativos (Fase 7b): LiveKit Rust SDK (libwebrtc), captura/reprodução de áudio, captura de tela e JPEG.
livekit = { version = "0.10", default-features = false, features = ["native", "rustls-tls-native-roots"] }
libwebrtc = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
cpal = "0.15"
scap = "0.0.8"
jpeg-encoder = "0.7"
# Supressão de ruído "Forte" (RNNoise do Xiph em Rust puro, BSD-3-Clause; sem libclang nem código nativo).
nnnoiseless = { version = "=0.5.2", default-features = false }
# Supressão de ruído "Máximo" (IA): DeepFilterNet3 (Rikorose; código e pesos MIT OR Apache-2.0). A versão publicada no
# crates.io (0.2.5, 2022) é do DeepFilterNet2 e não traz o modelo 3: usamos a tag v0.5.6 do repositório oficial (o
# `Cargo.lock` fixa o commit). `tract` 0.19 (inferência ONNX), sem Python nem biblioteca nativa; `default-model`
# embute o DFN3. Só o lib `df` é usado (sem as features `bin`, `dataset`, `wav-utils`).
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", tag = "v0.5.6", default-features = false, features = ["tract", "default-model"], optional = true }
# Mesma versão que o `deep_filter` já traz (0.15.6): só para montar as visões de quadro passadas ao modelo.
ndarray = { version = "0.15", optional = true }
thiserror = "2"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
nokhwa = { version = "0.10", optional = true, default-features = false, features = ["input-native"] }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg"] }

# O `scap` 0.0.8 foi escrito para o `Settings::new` de 5 argumentos do windows-capture 1.3/1.4; a 1.5.0 passou a
# exigir 8 e quebra a build no Windows. Fixado na última 1.4.x (não é usado diretamente por nós).
[target.'cfg(windows)'.dependencies]
windows-capture = "=1.4.4"
# Áudio por aplicativo no compartilhamento de tela (WASAPI "process loopback" + sessões de áudio). Mesma versão
# que o `scap` já traz (0.58.0 no Cargo.lock): não entra nenhuma versão nova; só habilita mais módulos da API.
# `implement`: o manipulador de conclusão da ativação assíncrona é um objeto COM nosso.
windows = { version = "=0.58.0", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Wdk_System_SystemServices",
] }
windows-core = "=0.58.0"

[dev-dependencies]
# Só nos testes: mintar tokens do LiveKit de dev e decodificar os JPEG gerados.
livekit-api = { version = "0.10", default-features = false, features = ["access-token"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
