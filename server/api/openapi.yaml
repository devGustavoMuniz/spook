components:
  schemas:
    AckBody:
      additionalProperties: false
      properties:
        message_id:
          description: ID da última mensagem lida. A leitura nunca regride (vale o maior ID) e é limitada à última mensagem do canal
          type: string
      required:
        - message_id
      type: object
    AttachmentPayload:
      additionalProperties: false
      properties:
        content_type:
          type: string
        filename:
          type: string
        height:
          description: Altura original; imagens processadas pelo job
          format: int32
          type: integer
        id:
          type: string
        size:
          format: int64
          type: integer
        thumbnail_url:
          description: Só em imagens, depois que o job de thumbnail termina (chega por MESSAGE_UPDATE)
          type: string
        url:
          description: GET pré-assinado, válido por 1 h
          type: string
        width:
          description: Largura original; imagens processadas pelo job
          format: int32
          type: integer
      required:
        - id
        - filename
        - content_type
        - size
        - url
      type: object
    AuthorPayload:
      additionalProperties: false
      properties:
        avatar_url:
          type: string
        display_name:
          type: string
        id:
          type: string
        username:
          type: string
      required:
        - id
        - username
      type: object
    AvatarInputBody:
      additionalProperties: false
      properties:
        content_type:
          enum:
            - image/png
            - image/jpeg
            - image/webp
          type: string
        size:
          description: Tamanho em bytes (máx. 5 MB)
          format: int64
          maximum: 5242880
          minimum: 1
          type: integer
      required:
        - content_type
        - size
      type: object
    AvatarOutputBody:
      additionalProperties: false
      properties:
        key:
          type: string
        upload_url:
          description: URL pré-assinada para PUT; envie o Content-Type e o tamanho declarados
          type: string
      required:
        - upload_url
        - key
      type: object
    CallRoom:
      additionalProperties: false
      properties:
        cameras:
          format: int64
          type: integer
        channel:
          description: Nome do canal de voz, ou "Conversa direta" em DM
          type: string
        channel_id:
          type: string
        dm:
          type: boolean
        duration_seconds:
          format: int64
          type: integer
        people:
          description: Usernames
          items:
            type: string
          type:
            - array
            - "null"
        screens:
          format: int64
          type: integer
        server:
          description: Vazio em DM
          type: string
        started_at:
          format: date-time
          type: string
      required:
        - channel_id
        - channel
        - dm
        - people
        - cameras
        - screens
        - duration_seconds
      type: object
    Calls:
      additionalProperties: false
      properties:
        generated_at:
          format: date-time
          type: string
        rooms:
          items:
            $ref: "#/components/schemas/CallRoom"
          type:
            - array
            - "null"
        summary:
          $ref: "#/components/schemas/CallsSummary"
      required:
        - generated_at
        - summary
        - rooms
      type: object
    CallsSummary:
      additionalProperties: false
      properties:
        available:
          description: Falso se a voz (LiveKit) está desligada ou não respondeu
          type: boolean
        cameras:
          description: Câmeras ligadas
          format: int64
          type: integer
        ongoing:
          description: Chamadas em andamento
          format: int64
          type: integer
        people:
          description: Pessoas em chamadas
          format: int64
          type: integer
        reason:
          type: string
        screens:
          description: Compartilhamentos de tela
          format: int64
          type: integer
      required:
        - available
        - ongoing
        - people
        - cameras
        - screens
      type: object
    ChannelPayload:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        guild_id:
          type:
            - string
            - "null"
        id:
          type: string
        last_message_id:
          type:
            - string
            - "null"
        name:
          type: string
        owner_id:
          description: Dono da DM em grupo
          type: string
        parent_id:
          description: Categoria que contém o canal
          type:
            - string
            - "null"
        position:
          format: int32
          type: integer
        recipients:
          description: Participantes da DM (todos, inclusive você)
          items:
            $ref: "#/components/schemas/RecipientPayload"
          type:
            - array
            - "null"
        type:
          description: 0 texto, 1 voz, 2 categoria, 3 DM, 4 DM em grupo
          format: int64
          type: integer
      required:
        - id
        - type
        - guild_id
        - parent_id
        - name
        - position
        - last_message_id
        - created_at
      type: object
    ChannelPlacement:
      additionalProperties: false
      properties:
        id:
          type: string
        parent_id:
          description: Categoria do canal; null o deixa fora de categorias
          type:
            - string
            - "null"
        position:
          format: int32
          minimum: 0
          type: integer
      required:
        - id
        - position
        - parent_id
      type: object
    Comparison:
      additionalProperties: false
      properties:
        change_pct:
          description: Variação percentual; nulo se o período anterior foi zero
          format: double
          type:
            - number
            - "null"
        previous:
          description: Soma dos 6 dias completos anteriores a esses
          format: int64
          type: integer
        recent:
          description: Soma dos últimos 6 dias completos (sem hoje)
          format: int64
          type: integer
      required:
        - recent
        - previous
        - change_pct
      type: object
    ContentBody:
      additionalProperties: false
      properties:
        content:
          description: 1 a 2000 caracteres (contados em runes), não só espaços
          maxLength: 2000
          minLength: 1
          type: string
      required:
        - content
      type: object
    CreateChannelInputBody:
      additionalProperties: false
      properties:
        name:
          maxLength: 100
          minLength: 1
          type: string
        parent_id:
          description: ID de uma categoria do servidor
          type: string
        position:
          description: "Padrão: ao final"
          format: int32
          minimum: 0
          type: integer
        type:
          description: 0 texto, 1 voz, 2 categoria
          enum:
            - 0
            - 1
            - 2
          format: int64
          type: integer
      required:
        - type
        - name
      type: object
    CreateGuildRequest:
      additionalProperties: false
      properties:
        name:
          maxLength: 100
          minLength: 2
          type: string
      required:
        - name
      type: object
    CreateGuildRoleRequest:
      additionalProperties: false
      properties:
        color:
          format: int32
          maximum: 16777215
          minimum: 0
          type: integer
        name:
          maxLength: 100
          minLength: 1
          type: string
        permissions:
          description: Bitflags; padrão 0
          format: int64
          minimum: 0
          type: integer
        position:
          description: "Padrão: 1 (logo acima do @everyone)"
          format: int32
          minimum: 1
          type: integer
      required:
        - name
      type: object
    CreateInviteRequest:
      additionalProperties: false
      properties:
        expires_in:
          description: "Segundos até expirar; padrão: não expira"
          format: int64
          maximum: 2592000
          minimum: 1
          type: integer
        max_uses:
          description: "Padrão: ilimitado"
          format: int32
          maximum: 1000000
          minimum: 1
          type: integer
      type: object
    CustomStatus:
      additionalProperties: false
      properties:
        emoji:
          maxLength: 32
          type: string
        expires_at:
          description: Instante em que o status some sozinho; ausente = não expira
          format: date-time
          type: string
        text:
          maxLength: 128
          type: string
      type: object
    DayCount:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        date:
          description: Dia em UTC (AAAA-MM-DD)
          type: string
      required:
        - date
        - count
      type: object
    DetailPayload:
      additionalProperties: false
      properties:
        channels:
          description: Ordenados por posição
          items:
            $ref: "#/components/schemas/ChannelPayload"
          type:
            - array
            - "null"
        created_at:
          format: date-time
          type: string
        icon_key:
          type:
            - string
            - "null"
        icon_url:
          description: URL temporária de leitura do ícone
          type: string
        id:
          type: string
        is_owner:
          type: boolean
        my_role_ids:
          items:
            type: string
          type:
            - array
            - "null"
        name:
          type: string
        owner_id:
          type: string
        permissions:
          description: Minhas permissões efetivas (bitflags)
          format: int64
          type: integer
        roles:
          description: Do mais alto para o mais baixo
          items:
            $ref: "#/components/schemas/RolePayload"
          type:
            - array
            - "null"
      required:
        - roles
        - channels
        - permissions
        - is_owner
        - my_role_ids
        - id
        - name
        - icon_key
        - owner_id
        - created_at
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    GuildPayload:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        icon_key:
          type:
            - string
            - "null"
        icon_url:
          description: URL temporária de leitura do ícone
          type: string
        id:
          type: string
        name:
          type: string
        owner_id:
          type: string
      required:
        - id
        - name
        - icon_key
        - owner_id
        - created_at
      type: object
    GuildReadStatePayload:
      additionalProperties: false
      properties:
        guild_id:
          type: string
        mention_count:
          format: int64
          type: integer
        unread_count:
          description: Soma dos canais, limitada a 100 (100 = 100 ou mais)
          format: int64
          type: integer
      required:
        - guild_id
        - unread_count
        - mention_count
      type: object
    InvitePayload:
      additionalProperties: false
      properties:
        code:
          type: string
        created_at:
          format: date-time
          type: string
        creator_id:
          type: string
        expires_at:
          description: null = não expira
          format: date-time
          type:
            - string
            - "null"
        guild_id:
          type: string
        max_uses:
          description: null = ilimitado
          format: int32
          type:
            - integer
            - "null"
        uses:
          format: int32
          type: integer
      required:
        - code
        - guild_id
        - creator_id
        - max_uses
        - uses
        - expires_at
        - created_at
      type: object
    Live:
      additionalProperties: false
      properties:
        calls:
          $ref: "#/components/schemas/CallsSummary"
        generated_at:
          format: date-time
          type: string
        livekit:
          $ref: "#/components/schemas/LiveKitUsage"
      required:
        - generated_at
        - calls
        - livekit
      type: object
    LiveKitUsage:
      additionalProperties: false
      properties:
        available:
          type: boolean
        bytes_in:
          description: Tráfego de entrada acumulado desde o boot do LiveKit
          format: double
          type: number
        bytes_in_per_sec:
          format: double
          type: number
        bytes_out:
          format: double
          type: number
        bytes_out_per_sec:
          format: double
          type: number
        jitter_ms:
          format: double
          type:
            - number
            - "null"
        packet_loss_pct:
          format: double
          type:
            - number
            - "null"
        packets_in:
          format: double
          type: number
        packets_out:
          format: double
          type: number
        packets_per_sec:
          description: Entrada + saída
          format: double
          type: number
        participants:
          format: double
          type: number
        quality_score:
          description: Nota de qualidade média do LiveKit (0 a 5)
          format: double
          type:
            - number
            - "null"
        reason:
          type: string
        rooms:
          format: double
          type: number
        rtt_ms:
          format: double
          type:
            - number
            - "null"
        tracks_published:
          format: double
          type: number
        tracks_subscribed:
          format: double
          type: number
      required:
        - available
        - rooms
        - participants
        - tracks_published
        - tracks_subscribed
        - bytes_in
        - bytes_out
        - bytes_in_per_sec
        - bytes_out_per_sec
        - packets_in
        - packets_out
        - packets_per_sec
        - packet_loss_pct
        - jitter_ms
        - rtt_ms
        - quality_score
      type: object
    LoginInputBody:
      additionalProperties: false
      properties:
        email:
          format: email
          maxLength: 254
          type: string
        password:
          maxLength: 128
          minLength: 1
          type: string
      required:
        - email
        - password
      type: object
    MemberListOutputBody:
      additionalProperties: false
      properties:
        has_more:
          type: boolean
        members:
          items:
            $ref: "#/components/schemas/MemberPayload"
          type:
            - array
            - "null"
      required:
        - members
        - has_more
      type: object
    MemberPayload:
      additionalProperties: false
      properties:
        avatar_url:
          type: string
        display_name:
          type: string
        guild_id:
          type: string
        joined_at:
          format: date-time
          type: string
        nickname:
          type:
            - string
            - "null"
        role_ids:
          description: Cargos do membro, sem o @everyone
          items:
            type: string
          type:
            - array
            - "null"
        user_id:
          type: string
        username:
          type: string
      required:
        - guild_id
        - user_id
        - nickname
        - joined_at
        - username
        - role_ids
      type: object
    MessageListOutputBody:
      additionalProperties: false
      properties:
        has_more:
          description: Há mensagens mais antigas; use before = id da última
          type: boolean
        messages:
          description: Da mais nova para a mais antiga
          items:
            $ref: "#/components/schemas/MessagePayload"
          type:
            - array
            - "null"
      required:
        - messages
        - has_more
      type: object
    MessagePayload:
      additionalProperties: false
      properties:
        attachments:
          items:
            $ref: "#/components/schemas/AttachmentPayload"
          type: array
        author:
          $ref: "#/components/schemas/AuthorPayload"
        channel_id:
          type: string
        content:
          type: string
        created_at:
          description: Derivado do ID Snowflake
          format: date-time
          type: string
        edited_at:
          format: date-time
          type:
            - string
            - "null"
        id:
          type: string
        mention_ids:
          description: IDs dos usuários mencionados com @username (só quem vê o canal, no máximo 20)
          items:
            type: string
          type: array
        pinned:
          description: A mensagem está fixada no canal
          type: boolean
        reply_to:
          description: Mensagem respondida (null quando não é uma resposta)
          oneOf:
            - $ref: "#/components/schemas/ReplyPreview"
            - type: "null"
      required:
        - id
        - channel_id
        - author
        - content
        - edited_at
        - created_at
        - attachments
        - mention_ids
        - reply_to
        - pinned
      type: object
    NotificationSettingBody:
      additionalProperties: false
      properties:
        level:
          description: Nível; ausente = herda
          enum:
            - all
            - mentions
            - none
          type: string
        muted:
          description: Silenciar (ausente = não silenciado)
          type: boolean
        muted_until:
          description: Fim do silêncio (futuro); ausente com muted=true = até reativar
          format: date-time
          type: string
      type: object
    OpenInputBody:
      additionalProperties: false
      properties:
        recipient_id:
          description: "DM 1:1: ID do outro usuário (precisa compartilhar um servidor com você)"
          type: string
        recipient_ids:
          description: "DM em grupo: de 1 a 9 usuários (máx. 10 participantes contando você, o dono); cada um precisa compartilhar um servidor com você"
          items:
            type: string
          maxItems: 9
          type:
            - array
            - "null"
      type: object
    Overview:
      additionalProperties: false
      properties:
        accounts:
          $ref: "#/components/schemas/OverviewAccountsStruct"
        attachments:
          $ref: "#/components/schemas/OverviewAttachmentsStruct"
        conversations:
          $ref: "#/components/schemas/OverviewConversationsStruct"
        generated_at:
          description: Quando o cache foi calculado
          format: date-time
          type: string
        messages:
          $ref: "#/components/schemas/OverviewMessagesStruct"
        messages_per_day:
          items:
            $ref: "#/components/schemas/DayCount"
          type:
            - array
            - "null"
        messages_trend:
          $ref: "#/components/schemas/Comparison"
        new_users_per_day:
          items:
            $ref: "#/components/schemas/DayCount"
          type:
            - array
            - "null"
        new_users_trend:
          $ref: "#/components/schemas/Comparison"
        servers:
          $ref: "#/components/schemas/OverviewServersStruct"
        users:
          $ref: "#/components/schemas/OverviewUsersStruct"
      required:
        - generated_at
        - users
        - accounts
        - servers
        - messages
        - attachments
        - conversations
        - new_users_per_day
        - messages_per_day
        - new_users_trend
        - messages_trend
      type: object
    OverviewAccountsStruct:
      additionalProperties: false
      properties:
        admins:
          format: int64
          type: integer
        registered:
          format: int64
          type: integer
        with_avatar:
          format: int64
          type: integer
      required:
        - registered
        - admins
        - with_avatar
      type: object
    OverviewAttachmentsStruct:
      additionalProperties: false
      properties:
        bytes:
          format: int64
          type: integer
        count:
          format: int64
          type: integer
      required:
        - count
        - bytes
      type: object
    OverviewConversationsStruct:
      additionalProperties: false
      properties:
        direct:
          format: int64
          type: integer
        groups:
          format: int64
          type: integer
      required:
        - direct
        - groups
      type: object
    OverviewMessagesStruct:
      additionalProperties: false
      properties:
        in_dms:
          format: int64
          type: integer
        in_guilds:
          format: int64
          type: integer
        last_24h:
          format: int64
          type: integer
        last_7d:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
      required:
        - total
        - last_24h
        - last_7d
        - in_guilds
        - in_dms
      type: object
    OverviewServersStruct:
      additionalProperties: false
      properties:
        active_invites:
          format: int64
          type: integer
        categories:
          format: int64
          type: integer
        invite_uses:
          format: int64
          type: integer
        memberships:
          format: int64
          type: integer
        roles:
          format: int64
          type: integer
        text_channels:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
        voice_channels:
          format: int64
          type: integer
        with_icon:
          format: int64
          type: integer
      required:
        - total
        - memberships
        - text_channels
        - voice_channels
        - categories
        - roles
        - active_invites
        - invite_uses
        - with_icon
      type: object
    OverviewUsersStruct:
      additionalProperties: false
      properties:
        growth_pct:
          description: Contas novas em 7 dias sobre as que existiam antes
          format: double
          type:
            - number
            - "null"
        new_24h:
          format: int64
          type: integer
        new_7d:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
      required:
        - total
        - new_24h
        - new_7d
        - growth_pct
      type: object
    PinsOutputBody:
      additionalProperties: false
      properties:
        messages:
          description: Fixadas (até 50), a mais recentemente fixada primeiro
          items:
            $ref: "#/components/schemas/MessagePayload"
          type: array
      required:
        - messages
      type: object
    PoolInfo:
      additionalProperties: false
      properties:
        idle:
          format: int32
          type: integer
        in_use:
          format: int32
          type: integer
        max:
          format: int32
          type: integer
        open:
          format: int32
          type: integer
        wait_count:
          description: Vezes que alguém esperou por uma conexão, acumulado
          format: int64
          type: integer
      required:
        - max
        - open
        - idle
        - in_use
        - wait_count
      type: object
    PresenceUpdateBody:
      additionalProperties: false
      properties:
        clear_custom_status:
          description: Remove o status personalizado
          type: boolean
        custom_status:
          $ref: "#/components/schemas/CustomStatus"
          description: Define o status personalizado (texto e/ou emoji; expires_at opcional, futuro e em até 48 h)
        status_pref:
          description: online (ausente é automático), dnd (Não perturbar) ou invisible
          enum:
            - online
            - dnd
            - invisible
          type: string
      type: object
    PreviewPayload:
      additionalProperties: false
      properties:
        code:
          type: string
        expires_at:
          format: date-time
          type:
            - string
            - "null"
        guild_icon_url:
          type: string
        guild_id:
          type: string
        guild_name:
          type: string
        max_uses:
          format: int32
          type:
            - integer
            - "null"
        member_count:
          format: int64
          type: integer
        uses:
          format: int32
          type: integer
      required:
        - code
        - guild_id
        - guild_name
        - member_count
        - max_uses
        - uses
        - expires_at
      type: object
    ReadStatePayload:
      additionalProperties: false
      properties:
        channel_id:
          type: string
        guild_id:
          description: Omitido em DMs
          type: string
        last_read_message_id:
          description: Último ID lido; sem leitura registrada, a base (entrada no servidor ou criação da DM)
          type: string
        mention_count:
          format: int64
          type: integer
        unread_count:
          description: Mensagens não lidas de outros usuários, limitado a 100 (100 = 100 ou mais; a UI mostra 99+)
          format: int64
          type: integer
      required:
        - channel_id
        - last_read_message_id
        - mention_count
        - unread_count
      type: object
    ReadStatesOutputBody:
      additionalProperties: false
      properties:
        guilds:
          description: "Agregado por servidor: soma de unread_count (limitada a 100) e de mention_count"
          items:
            $ref: "#/components/schemas/GuildReadStatePayload"
          type: array
        read_states:
          description: Um item por canal de texto visível e por DM; unread_count vai até 100 (100 = 100 ou mais, a UI mostra 99+)
          items:
            $ref: "#/components/schemas/ReadStatePayload"
          type: array
      required:
        - read_states
        - guilds
      type: object
    RecipientPayload:
      additionalProperties: false
      properties:
        avatar_url:
          type: string
        display_name:
          type: string
        id:
          type: string
        username:
          type: string
      required:
        - id
        - username
      type: object
    RegisterInputBody:
      additionalProperties: false
      properties:
        email:
          format: email
          maxLength: 254
          type: string
        password:
          maxLength: 128
          minLength: 8
          type: string
        username:
          maxLength: 32
          minLength: 2
          pattern: ^[a-z0-9_.]{2,32}$
          patternDescription: "2 a 32 caracteres: a-z, 0-9, _ e ."
          type: string
      required:
        - email
        - username
        - password
      type: object
    ReorderChannelsInputBody:
      additionalProperties: false
      properties:
        channels:
          items:
            $ref: "#/components/schemas/ChannelPlacement"
          maxItems: 500
          type:
            - array
            - "null"
      required:
        - channels
      type: object
    ReplyAuthorPayload:
      additionalProperties: false
      properties:
        display_name:
          type: string
        id:
          type: string
        username:
          type: string
      required:
        - id
        - username
      type: object
    ReplyPreview:
      additionalProperties: false
      properties:
        author:
          $ref: "#/components/schemas/ReplyAuthorPayload"
        content:
          description: Até 100 caracteres (runes); vazio quando deleted
          type: string
        deleted:
          description: A mensagem original foi apagada (sem conteúdo)
          type: boolean
        has_attachments:
          type: boolean
        id:
          type: string
      required:
        - id
        - author
        - content
        - has_attachments
        - deleted
      type: object
    RequestGuildIconUploadRequest:
      additionalProperties: false
      properties:
        content_type:
          enum:
            - image/png
            - image/jpeg
            - image/webp
          type: string
        size:
          description: Tamanho em bytes (máx. 5 MB)
          format: int64
          maximum: 5242880
          minimum: 1
          type: integer
      required:
        - content_type
        - size
      type: object
    RequestGuildIconUploadResponse:
      additionalProperties: false
      properties:
        key:
          type: string
        upload_url:
          description: URL pré-assinada para PUT; envie o Content-Type e o tamanho declarados
          type: string
      required:
        - upload_url
        - key
      type: object
    RolePayload:
      additionalProperties: false
      properties:
        color:
          description: RGB (0..16777215) ou null
          format: int32
          type:
            - integer
            - "null"
        guild_id:
          type: string
        id:
          type: string
        is_everyone:
          type: boolean
        name:
          type: string
        permissions:
          description: Bitflags (SPEC 7.2)
          format: int64
          type: integer
        position:
          description: Maior = mais alto na hierarquia; @everyone é 0
          format: int32
          type: integer
      required:
        - id
        - guild_id
        - name
        - color
        - position
        - permissions
        - is_everyone
      type: object
    SelfPayload:
      additionalProperties: false
      properties:
        custom_status:
          $ref: "#/components/schemas/CustomStatus"
        status_pref:
          enum:
            - online
            - dnd
            - invisible
          type: string
      required:
        - status_pref
      type: object
    SendBody:
      additionalProperties: false
      properties:
        attachment_ids:
          description: Até 10 IDs de uploads já enviados ao storage (POST /channels/{id}/uploads); só anexos seus, deste canal, ainda sem mensagem e com menos de 1 h
          items:
            type: string
          type:
            - array
            - "null"
        content:
          description: Até 2000 caracteres (runes); pode ser vazio se houver anexo
          maxLength: 2000
          type: string
        mention_reply:
          description: "Menciona o autor da mensagem respondida (padrão true): ele recebe contador de menção e push, como um @ direto"
          type: boolean
        reply_to:
          description: ID da mensagem respondida; precisa existir, não estar apagada e ser deste canal (422 caso contrário)
          type: string
      type: object
    ServerRow:
      additionalProperties: false
      properties:
        channels:
          description: Canais de texto e de voz (sem categorias)
          format: int64
          type: integer
        created_at:
          format: date-time
          type: string
        id:
          description: ID Snowflake (string)
          type: string
        invites_active:
          format: int64
          type: integer
        members:
          format: int64
          type: integer
        messages:
          format: int64
          type: integer
        name:
          type: string
        owner:
          description: Username do dono
          type: string
      required:
        - id
        - name
        - owner
        - members
        - channels
        - messages
        - invites_active
        - created_at
      type: object
    ServersBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/ServerRow"
          type:
            - array
            - "null"
        order:
          type: string
        page:
          format: int64
          type: integer
        page_size:
          format: int64
          type: integer
        q:
          type: string
        sort:
          type: string
        total:
          description: Total de linhas que casam com a busca
          format: int64
          type: integer
      required:
        - items
        - total
        - page
        - page_size
        - sort
        - order
        - q
      type: object
    SessionBody:
      additionalProperties: false
      properties:
        token:
          description: "Só é devolvido ao cliente desktop (header X-Spook-Client: desktop); a web usa o cookie httpOnly"
          type: string
        user:
          $ref: "#/components/schemas/View"
      required:
        - user
      type: object
    SettingPayload:
      additionalProperties: false
      properties:
        level:
          description: Nível de notificação; nulo = herda (canal -> servidor -> padrão)
          enum:
            - all
            - mentions
            - none
          type:
            - string
            - "null"
        muted:
          description: Silenciado (vale até muted_until; sem muted_until, até reativar)
          type: boolean
        muted_until:
          description: Fim do silêncio; nulo com muted=true = até reativar
          format: date-time
          type:
            - string
            - "null"
        scope:
          description: guild, ou channel (canal de servidor, DM ou DM em grupo)
          enum:
            - guild
            - channel
          type: string
        target_id:
          type: string
      required:
        - scope
        - target_id
        - muted
        - muted_until
        - level
      type: object
    SettingsOutputBody:
      additionalProperties: false
      properties:
        settings:
          items:
            $ref: "#/components/schemas/SettingPayload"
          type: array
      required:
        - settings
      type: object
    StatePayload:
      additionalProperties: false
      properties:
        channel_id:
          description: Nulo quando o usuário saiu da voz
          type:
            - string
            - "null"
        guild_id:
          description: Nulo em DM
          type:
            - string
            - "null"
        self_deaf:
          type: boolean
        self_mute:
          type: boolean
        self_screen:
          description: Compartilhando a tela
          type: boolean
        self_video:
          description: Câmera ligada
          type: boolean
        user_id:
          type: string
      required:
        - guild_id
        - channel_id
        - user_id
        - self_mute
        - self_deaf
        - self_video
        - self_screen
      type: object
    SubscribeBody:
      additionalProperties: false
      properties:
        endpoint:
          description: URL https do serviço de push (PushSubscription.endpoint); redes internas são recusadas
          maxLength: 2048
          minLength: 1
          type: string
        keys:
          $ref: "#/components/schemas/SubscriptionKeys"
          description: PushSubscription.toJSON().keys
      required:
        - endpoint
        - keys
      type: object
    SubscriptionKeys:
      additionalProperties: false
      properties:
        auth:
          maxLength: 256
          minLength: 1
          type: string
        p256dh:
          maxLength: 256
          minLength: 1
          type: string
      required:
        - p256dh
        - auth
      type: object
    System:
      additionalProperties: false
      properties:
        app:
          $ref: "#/components/schemas/SystemAppStruct"
        database:
          $ref: "#/components/schemas/SystemDatabaseStruct"
        gateway:
          $ref: "#/components/schemas/SystemGatewayStruct"
        generated_at:
          format: date-time
          type: string
        jobs:
          $ref: "#/components/schemas/SystemJobsStruct"
        storage:
          $ref: "#/components/schemas/SystemStorageStruct"
      required:
        - generated_at
        - app
        - database
        - storage
        - jobs
        - gateway
      type: object
    SystemAppStruct:
      additionalProperties: false
      properties:
        commit:
          type: string
        environment:
          type: string
        go_version:
          type: string
        goroutines:
          format: int64
          type: integer
        heap_bytes:
          format: int64
          minimum: 0
          type: integer
        rss_bytes:
          description: Memória residente do processo (só em Linux)
          format: int64
          type:
            - integer
            - "null"
        server_time:
          format: date-time
          type: string
        started_at:
          format: date-time
          type: string
        sys_bytes:
          description: Memória obtida do sistema pelo runtime do Go
          format: int64
          minimum: 0
          type: integer
        uptime_seconds:
          format: int64
          type: integer
        version:
          type: string
      required:
        - version
        - commit
        - environment
        - server_time
        - started_at
        - uptime_seconds
        - go_version
        - goroutines
        - heap_bytes
        - sys_bytes
        - rss_bytes
      type: object
    SystemDatabaseStruct:
      additionalProperties: false
      properties:
        pool:
          $ref: "#/components/schemas/PoolInfo"
        size_bytes:
          format: int64
          type: integer
        tables:
          items:
            $ref: "#/components/schemas/TableSize"
          type:
            - array
            - "null"
      required:
        - size_bytes
        - tables
      type: object
    SystemGatewayStruct:
      additionalProperties: false
      properties:
        available:
          type: boolean
        connections:
          description: Conexões WebSocket abertas
          format: int64
          type: integer
        events_per_second:
          description: Eventos entregues por segundo, média entre as duas últimas leituras
          format: double
          type: number
        events_total:
          format: int64
          type: integer
        online_users:
          description: Usuários distintos com sessão viva
          format: int64
          type: integer
        sessions:
          format: int64
          type: integer
      required:
        - available
        - connections
        - sessions
        - online_users
        - events_per_second
        - events_total
      type: object
    SystemJobsStruct:
      additionalProperties: false
      properties:
        available:
          description: Falso se a fila (River) não está rodando neste servidor
          type: boolean
        failed:
          description: Descartados após esgotar as tentativas
          format: int64
          type: integer
        pending:
          description: Disponíveis para execução
          format: int64
          type: integer
        retryable:
          description: Falharam e vão tentar de novo
          format: int64
          type: integer
        running:
          format: int64
          type: integer
        scheduled:
          format: int64
          type: integer
      required:
        - available
        - pending
        - running
        - retryable
        - failed
        - scheduled
      type: object
    SystemStorageStruct:
      additionalProperties: false
      properties:
        attachment_bytes:
          format: int64
          type: integer
        attachment_count:
          format: int64
          type: integer
        avatars:
          description: Quantidade de avatares (o tamanho em bytes não é gravado)
          format: int64
          type: integer
        guild_icons:
          description: Quantidade de ícones de servidor (o tamanho em bytes não é gravado)
          format: int64
          type: integer
      required:
        - attachment_count
        - attachment_bytes
        - avatars
        - guild_icons
      type: object
    TableSize:
      additionalProperties: false
      properties:
        bytes:
          format: int64
          type: integer
        name:
          type: string
        rows_estimate:
          format: int64
          type: integer
      required:
        - name
        - bytes
        - rows_estimate
      type: object
    TicketBody:
      additionalProperties: false
      properties:
        expires_in:
          description: Segundos de validade
          format: int64
          type: integer
        ticket:
          description: Uso único; passe em GET /api/gateway?ticket=…
          type: string
      required:
        - ticket
        - expires_in
      type: object
    TokenResponse:
      additionalProperties: false
      properties:
        expires_in:
          description: Segundos até o token expirar (600)
          format: int64
          type: integer
        token:
          description: JWT do LiveKit, de uma sala só
          type: string
        url:
          description: URL de sinalização do LiveKit (wss://…)
          type: string
      required:
        - url
        - token
        - expires_in
      type: object
    TransferGuildRequest:
      additionalProperties: false
      properties:
        user_id:
          description: Novo dono; precisa ser membro
          type: string
      required:
        - user_id
      type: object
    UnsubscribeBody:
      additionalProperties: false
      properties:
        endpoint:
          maxLength: 2048
          minLength: 1
          type: string
      required:
        - endpoint
      type: object
    UpdateChannelInputBody:
      additionalProperties: false
      properties:
        name:
          maxLength: 100
          minLength: 1
          type: string
        position:
          format: int32
          minimum: 0
          type: integer
      type: object
    UpdateGuildRequest:
      additionalProperties: false
      properties:
        icon_key:
          description: Chave devolvida por /guilds/{guild_id}/icon; vazio remove o ícone
          maxLength: 200
          type: string
        name:
          maxLength: 100
          minLength: 2
          type: string
      type: object
    UpdateGuildRoleRequest:
      additionalProperties: false
      properties:
        color:
          format: int32
          maximum: 16777215
          minimum: 0
          type: integer
        name:
          maxLength: 100
          minLength: 1
          type: string
        permissions:
          format: int64
          minimum: 0
          type: integer
        position:
          format: int32
          minimum: 1
          type: integer
        remove_color:
          type: boolean
      type: object
    UpdatePayload:
      additionalProperties: false
      properties:
        channel_id:
          type: string
        last_read_message_id:
          type: string
        mention_count:
          format: int64
          type: integer
      required:
        - channel_id
        - last_read_message_id
        - mention_count
      type: object
    UpdateProfileInputBody:
      additionalProperties: false
      properties:
        avatar_key:
          description: Chave devolvida por /users/me/avatar
          maxLength: 200
          type: string
        display_name:
          description: Vazio remove o nome de exibição
          maxLength: 32
          type: string
        remove_avatar:
          type: boolean
      type: object
    UpdateVoiceStateRequest:
      additionalProperties: false
      properties:
        self_deaf:
          type: boolean
        self_mute:
          type: boolean
      required:
        - self_mute
        - self_deaf
      type: object
    UploadBody:
      additionalProperties: false
      properties:
        content_type:
          description: Tipo permitido (png, jpeg, gif, webp, pdf, text/plain, zip, audio mpeg/ogg/webm, vídeo mp4/webm); a extensão do nome precisa combinar
          type: string
        filename:
          description: Nome original; o servidor tira caminho e caracteres de controle e limita a 100 caracteres
          maxLength: 255
          minLength: 1
          type: string
        size:
          description: Tamanho em bytes, de 1 a 26214400 (25 MB)
          format: int64
          type: integer
      required:
        - filename
        - content_type
        - size
      type: object
    UploadPayload:
      additionalProperties: false
      properties:
        expires_in:
          description: Segundos até a URL de PUT expirar
          format: int64
          type: integer
        headers:
          additionalProperties:
            type: string
          description: Cabeçalhos que o PUT precisa enviar exatamente assim
          type: object
        id:
          description: Use em attachment_ids ao enviar a mensagem
          type: string
        upload_url:
          description: PUT pré-assinado; envie o arquivo cru como corpo
          type: string
      required:
        - id
        - upload_url
        - headers
        - expires_in
      type: object
    UserRow:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        email:
          type: string
        guilds_member:
          description: Servidores de que participa
          format: int64
          type: integer
        guilds_owned:
          description: Servidores que possui
          format: int64
          type: integer
        id:
          description: ID Snowflake (string)
          type: string
        last_active_at:
          description: Último login (sessão mais recente); o app não registra outra atividade
          format: date-time
          type: string
        messages_sent:
          format: int64
          type: integer
        username:
          type: string
      required:
        - id
        - username
        - email
        - guilds_member
        - guilds_owned
        - messages_sent
        - created_at
      type: object
    UsersBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/UserRow"
          type:
            - array
            - "null"
        order:
          type: string
        page:
          format: int64
          type: integer
        page_size:
          format: int64
          type: integer
        q:
          type: string
        sort:
          type: string
        total:
          description: Total de linhas que casam com a busca
          format: int64
          type: integer
      required:
        - items
        - total
        - page
        - page_size
        - sort
        - order
        - q
      type: object
    VAPIDOutputBody:
      additionalProperties: false
      properties:
        public_key:
          description: Chave pública VAPID (base64url) para pushManager.subscribe({applicationServerKey})
          type: string
      required:
        - public_key
      type: object
    View:
      additionalProperties: false
      properties:
        avatar_url:
          description: URL temporária de leitura do avatar
          type: string
        created_at:
          format: date-time
          type: string
        display_name:
          type: string
        email:
          type: string
        id:
          description: ID Snowflake (string, pois excede 53 bits)
          type: string
        is_admin:
          description: Administrador do painel /admin (só para mostrar o link; o backend decide o acesso)
          type: boolean
        username:
          type: string
      required:
        - id
        - email
        - username
        - created_at
        - is_admin
      type: object
  securitySchemes:
    bearerAuth:
      scheme: bearer
      type: http
    cookieAuth:
      in: cookie
      name: spook_session
      type: apiKey
info:
  title: Spook API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/admin/calls:
    get:
      operationId: adminCalls
      parameters:
        - description: Filtra por servidor, canal ou pessoa
          explode: false
          in: query
          name: q
          schema:
            description: Filtra por servidor, canal ou pessoa
            maxLength: 100
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calls"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: Salas de voz ativas lidas do LiveKit (cache de 5 s)
      tags:
        - admin
  /api/admin/live:
    get:
      operationId: adminLive
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Live"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: Chamadas ao vivo e uso do LiveKit (cache de 5 s)
      tags:
        - admin
  /api/admin/overview:
    get:
      operationId: adminOverview
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: Contagens, séries de 14 dias e comparações (cache de 30 s)
      tags:
        - admin
  /api/admin/servers:
    get:
      operationId: adminServers
      parameters:
        - description: Busca por texto (parte do nome/username/e-mail)
          explode: false
          in: query
          name: q
          schema:
            description: Busca por texto (parte do nome/username/e-mail)
            maxLength: 100
            type: string
        - description: Coluna de ordenação (padrão created_at)
          explode: false
          in: query
          name: sort
          schema:
            description: Coluna de ordenação (padrão created_at)
            type: string
        - explode: false
          in: query
          name: order
          schema:
            default: desc
            enum:
              - asc
              - desc
            type: string
        - explode: false
          in: query
          name: page
          schema:
            default: 1
            format: int64
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServersBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
