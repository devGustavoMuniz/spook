  /api/auth/confirm-password:
    post:
      description: "Libera as ações sensíveis (trocar e-mail, excluir conta ou servidor). Senha errada responde 422; limite: 5 tentativas e depois 1 a cada 30 s por usuário."
      operationId: confirmPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPasswordInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmPasswordOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: "Confirma a senha (\"modo sudo\"): a sessão fica confirmada por 10 minutos"
      tags:
        - auth
  /api/auth/desktop/authorize:
    post:
      description: Chamado pela página /desktop-login depois que a pessoa confirma "Entrar no app do computador" (sessão do navegador). Devolve o código (vale 60 s, uso único) e o deep link `spook://auth?code=...`. O app troca o código em `POST /api/auth/desktop/exchange` com o `code_verifier` (PKCE).
      operationId: desktopAuthorize
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesktopAuthorizeInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesktopAuthorizeOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: "Login do desktop pelo navegador: gera o código de uso único para o app"
      tags:
        - auth
  /api/auth/desktop/exchange:
    post:
      description: "Sem sessão prévia. O código é de uso único e vale 60 s; uma tentativa com verificador errado também consome o código. Devolve o token no corpo (como o login com `X-Spook-Client: desktop`) e abre a sessão."
      operationId: desktopExchange
      parameters:
        - in: header
          name: User-Agent
          schema:
            type: string
        - description: Use "desktop" para receber o token no corpo
          in: header
          name: X-Spook-Client
          schema:
            description: Use "desktop" para receber o token no corpo
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesktopExchangeInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionBody"
          description: OK
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Troca o código do handoff (+ code_verifier PKCE) por um token Bearer do desktop
      tags:
        - auth
  /api/auth/email/resend:
    post:
      description: "Limite: 3 pedidos e depois 1 por minuto por usuário, e por destinatário. 409 `already_verified` se o e-mail já foi confirmado; 503 `email_disabled` quando o servidor está sem e-mail (modo degradado)."
      operationId: resendVerificationEmail
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: Reenvia o e-mail de verificação
      tags:
        - auth
  /api/auth/email/verify:
    post:
      description: "Sem sessão: o link pode abrir em outro navegador. Token de uso único (24 h). Inválido, expirado ou já usado: 410 com `code` `token_invalid` ou `token_expired`. O token só trafega no corpo do POST (a página do link o remove da URL)."
      operationId: verifyEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyOutputBody"
          description: OK
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "410":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Gone
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Confirma o e-mail (cadastro) ou conclui a troca de e-mail, com o token do link
      tags:
        - auth
  /api/auth/login:
    post:
      operationId: login
      parameters:
        - in: header
          name: User-Agent
          schema:
            type: string
        - description: Use "desktop" para receber o token no corpo
          in: header
          name: X-Spook-Client
          schema:
            description: Use "desktop" para receber o token no corpo
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionBody"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Login
      tags:
        - auth
  /api/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: Logout (encerra a sessão atual)
      tags:
        - auth
  /api/auth/password/forgot:
    post:
      description: "A resposta é SEMPRE a mesma (202), exista ou não conta com esse e-mail, e demora um mínimo fixo para o tempo não revelar nada. Limite por IP (5 e depois 1 a cada 2 min) e por e-mail (silencioso: acima do limite nada é enviado). O link vale 30 min, uso único."
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotInputBody"
        required: true
      responses:
        "202":
          description: Accepted
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Pede o link de redefinição de senha por e-mail
      tags:
        - auth
  /api/auth/password/reset:
    post:
      description: "Token de uso único (30 min). Senha fora das regras (8 a 128) responde 422 sem gastar o token. Inválido/expirado: 410 com `code`."
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetInputBody"
        required: true
      responses:
        "204":
          description: No Content
        "410":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Gone
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Redefine a senha com o token do e-mail (encerra TODAS as sessões)
      tags:
        - auth
  /api/auth/providers:
    get:
      operationId: authProviders
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvidersOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Provedores de login social ligados e se o e-mail está ativo
      tags:
        - auth
  /api/auth/register:
    post:
      operationId: register
      parameters:
        - in: header
          name: User-Agent
          schema:
            type: string
        - description: Use "desktop" para receber o token no corpo
          in: header
          name: X-Spook-Client
          schema:
            description: Use "desktop" para receber o token no corpo
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInputBody"
