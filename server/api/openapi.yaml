          type: boolean
        has_password:
          description: Falso em contas criadas por login social que ainda não definiram senha
          type: boolean
        id:
          description: ID Snowflake (string, pois excede 53 bits)
          type: string
        is_admin:
          description: Administrador do painel /admin (só para mostrar o link; o backend decide o acesso)
          type: boolean
        pending_email:
          description: Endereço novo aguardando confirmação por e-mail (a troca só vale depois do clique no link)
          type: string
        pronouns:
          description: Pronomes (até 40 caracteres)
          type: string
        username:
          type: string
      required:
        - id
        - email
        - username
        - created_at
        - email_verified
        - has_password
        - is_admin
      type: object
  securitySchemes:
    bearerAuth:
      scheme: bearer
      type: http
    cookieAuth:
      in: cookie
      name: spook_session
      type: apiKey
info:
  title: Spook API
  version: 0.1.0
openapi: 3.1.0
