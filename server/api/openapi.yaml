components:
  schemas:
    AuthorPayload:
      additionalProperties: false
      properties:
        avatar_url:
          type: string
        display_name:
          type: string
        id:
          type: string
        username:
          type: string
      required:
        - id
        - username
      type: object
    AvatarInputBody:
      additionalProperties: false
      properties:
        content_type:
          enum:
            - image/png
            - image/jpeg
            - image/webp
          type: string
        size:
          description: Tamanho em bytes (máx. 5 MB)
          format: int64
          maximum: 5242880
          minimum: 1
          type: integer
      required:
        - content_type
        - size
      type: object
    AvatarOutputBody:
      additionalProperties: false
      properties:
        key:
          type: string
        upload_url:
          description: URL pré-assinada para PUT; envie o Content-Type e o tamanho declarados
          type: string
      required:
        - upload_url
        - key
      type: object
    ChannelPayload:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        guild_id:
          type:
            - string
            - "null"
        id:
          type: string
        last_message_id:
          type:
            - string
            - "null"
        name:
          type: string
        parent_id:
          description: Categoria que contém o canal
          type:
            - string
            - "null"
        position:
          format: int32
          type: integer
        type:
          description: 0 texto, 1 voz, 2 categoria
          format: int64
          type: integer
      required:
        - id
        - type
        - guild_id
        - parent_id
        - name
        - position
        - last_message_id
        - created_at
      type: object
    ChannelPlacement:
      additionalProperties: false
      properties:
        id:
          type: string
        parent_id:
          description: Categoria do canal; null o deixa fora de categorias
          type:
            - string
            - "null"
        position:
          format: int32
          minimum: 0
          type: integer
      required:
        - id
        - position
        - parent_id
      type: object
    ContentBody:
      additionalProperties: false
      properties:
        content:
          description: 1 a 2000 caracteres (contados em runes), não só espaços
          maxLength: 2000
          minLength: 1
          type: string
      required:
        - content
      type: object
    CreateChannelInputBody:
      additionalProperties: false
      properties:
        name:
          maxLength: 100
          minLength: 1
          type: string
        parent_id:
          description: ID de uma categoria do servidor
          type: string
        position:
          description: "Padrão: ao final"
          format: int32
          minimum: 0
          type: integer
        type:
          description: 0 texto, 1 voz, 2 categoria
          enum:
            - 0
            - 1
            - 2
          format: int64
          type: integer
      required:
        - type
        - name
      type: object
    CreateGuildRequest:
      additionalProperties: false
      properties:
        name:
          maxLength: 100
          minLength: 2
          type: string
      required:
        - name
      type: object
    CreateGuildRoleRequest:
      additionalProperties: false
      properties:
        color:
          format: int32
          maximum: 16777215
          minimum: 0
          type: integer
        name:
          maxLength: 100
          minLength: 1
          type: string
        permissions:
          description: Bitflags; padrão 0
          format: int64
          minimum: 0
          type: integer
        position:
          description: "Padrão: 1 (logo acima do @everyone)"
          format: int32
          minimum: 1
          type: integer
      required:
        - name
      type: object
    CreateInviteRequest:
      additionalProperties: false
      properties:
        expires_in:
          description: "Segundos até expirar; padrão: não expira"
          format: int64
          maximum: 2592000
          minimum: 1
          type: integer
        max_uses:
          description: "Padrão: ilimitado"
          format: int32
          maximum: 1000000
          minimum: 1
          type: integer
      type: object
    DetailPayload:
      additionalProperties: false
      properties:
        channels:
          description: Ordenados por posição
          items:
            $ref: "#/components/schemas/ChannelPayload"
          type:
            - array
            - "null"
        created_at:
          format: date-time
          type: string
        icon_key:
          type:
            - string
            - "null"
        icon_url:
          description: URL temporária de leitura do ícone
          type: string
        id:
          type: string
        is_owner:
          type: boolean
        my_role_ids:
          items:
            type: string
          type:
            - array
            - "null"
        name:
          type: string
        owner_id:
          type: string
        permissions:
          description: Minhas permissões efetivas (bitflags)
          format: int64
          type: integer
        roles:
          description: Do mais alto para o mais baixo
          items:
            $ref: "#/components/schemas/RolePayload"
          type:
            - array
            - "null"
      required:
        - roles
        - channels
        - permissions
        - is_owner
        - my_role_ids
        - id
        - name
        - icon_key
        - owner_id
        - created_at
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    GuildPayload:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        icon_key:
          type:
            - string
            - "null"
        icon_url:
          description: URL temporária de leitura do ícone
          type: string
        id:
          type: string
        name:
          type: string
        owner_id:
          type: string
      required:
        - id
        - name
        - icon_key
        - owner_id
        - created_at
      type: object
    InvitePayload:
      additionalProperties: false
      properties:
        code:
          type: string
        created_at:
          format: date-time
          type: string
        creator_id:
          type: string
        expires_at:
          description: null = não expira
          format: date-time
          type:
            - string
            - "null"
        guild_id:
          type: string
        max_uses:
          description: null = ilimitado
          format: int32
          type:
            - integer
            - "null"
        uses:
          format: int32
          type: integer
      required:
        - code
        - guild_id
        - creator_id
        - max_uses
        - uses
        - expires_at
        - created_at
      type: object
    LoginInputBody:
      additionalProperties: false
      properties:
        email:
          format: email
          maxLength: 254
          type: string
        password:
          maxLength: 128
          minLength: 1
          type: string
      required:
        - email
        - password
      type: object
    MemberListOutputBody:
      additionalProperties: false
      properties:
        has_more:
          type: boolean
        members:
          items:
            $ref: "#/components/schemas/MemberPayload"
          type:
            - array
            - "null"
      required:
        - members
        - has_more
      type: object
    MemberPayload:
      additionalProperties: false
      properties:
        avatar_url:
          type: string
        display_name:
          type: string
        guild_id:
          type: string
        joined_at:
          format: date-time
          type: string
        nickname:
          type:
            - string
            - "null"
        role_ids:
          description: Cargos do membro, sem o @everyone
          items:
            type: string
          type:
            - array
            - "null"
        user_id:
          type: string
        username:
          type: string
      required:
        - guild_id
        - user_id
        - nickname
        - joined_at
        - username
        - role_ids
      type: object
    MessageListOutputBody:
      additionalProperties: false
      properties:
        has_more:
          description: Há mensagens mais antigas; use before = id da última
          type: boolean
        messages:
          description: Da mais nova para a mais antiga
          items:
            $ref: "#/components/schemas/MessagePayload"
          type:
            - array
            - "null"
      required:
        - messages
        - has_more
      type: object
    MessagePayload:
      additionalProperties: false
      properties:
        author:
          $ref: "#/components/schemas/AuthorPayload"
        channel_id:
          type: string
        content:
          type: string
        created_at:
          description: Derivado do ID Snowflake
          format: date-time
          type: string
        edited_at:
          format: date-time
          type:
            - string
            - "null"
        id:
          type: string
      required:
        - id
        - channel_id
        - author
        - content
        - edited_at
        - created_at
      type: object
    PreviewPayload:
      additionalProperties: false
      properties:
        code:
          type: string
        expires_at:
          format: date-time
          type:
            - string
            - "null"
        guild_icon_url:
          type: string
        guild_id:
          type: string
        guild_name:
          type: string
        max_uses:
          format: int32
          type:
            - integer
            - "null"
        member_count:
          format: int64
          type: integer
        uses:
          format: int32
          type: integer
      required:
        - code
        - guild_id
        - guild_name
        - member_count
        - max_uses
        - uses
        - expires_at
      type: object
    RegisterInputBody:
      additionalProperties: false
      properties:
        email:
          format: email
          maxLength: 254
          type: string
        password:
          maxLength: 128
          minLength: 8
          type: string
        username:
          maxLength: 32
          minLength: 2
          pattern: ^[a-z0-9_.]{2,32}$
          patternDescription: "2 a 32 caracteres: a-z, 0-9, _ e ."
          type: string
      required:
        - email
        - username
        - password
      type: object
    ReorderChannelsInputBody:
      additionalProperties: false
      properties:
        channels:
          items:
            $ref: "#/components/schemas/ChannelPlacement"
          maxItems: 500
          type:
            - array
            - "null"
      required:
        - channels
      type: object
    RequestGuildIconUploadRequest:
      additionalProperties: false
      properties:
        content_type:
          enum:
            - image/png
            - image/jpeg
            - image/webp
          type: string
        size:
          description: Tamanho em bytes (máx. 5 MB)
          format: int64
          maximum: 5242880
          minimum: 1
          type: integer
      required:
        - content_type
        - size
      type: object
    RequestGuildIconUploadResponse:
      additionalProperties: false
      properties:
        key:
          type: string
        upload_url:
          description: URL pré-assinada para PUT; envie o Content-Type e o tamanho declarados
          type: string
      required:
        - upload_url
        - key
      type: object
    RolePayload:
      additionalProperties: false
      properties:
        color:
          description: RGB (0..16777215) ou null
          format: int32
          type:
            - integer
            - "null"
        guild_id:
          type: string
        id:
          type: string
        is_everyone:
          type: boolean
        name:
          type: string
        permissions:
          description: Bitflags (SPEC 7.2)
          format: int64
          type: integer
        position:
          description: Maior = mais alto na hierarquia; @everyone é 0
          format: int32
          type: integer
      required:
        - id
        - guild_id
        - name
        - color
        - position
        - permissions
        - is_everyone
      type: object
    SessionBody:
      additionalProperties: false
      properties:
        token:
          description: "Só é devolvido ao cliente desktop (header X-Spook-Client: desktop); a web usa o cookie httpOnly"
          type: string
        user:
          $ref: "#/components/schemas/View"
      required:
        - user
      type: object
    TransferGuildRequest:
      additionalProperties: false
      properties:
        user_id:
          description: Novo dono; precisa ser membro
          type: string
      required:
        - user_id
      type: object
    UpdateChannelInputBody:
      additionalProperties: false
      properties:
        name:
          maxLength: 100
          minLength: 1
          type: string
        position:
          format: int32
          minimum: 0
          type: integer
      type: object
    UpdateGuildRequest:
      additionalProperties: false
      properties:
        icon_key:
          description: Chave devolvida por /guilds/{guild_id}/icon; vazio remove o ícone
          maxLength: 200
          type: string
        name:
          maxLength: 100
          minLength: 2
          type: string
      type: object
    UpdateGuildRoleRequest:
      additionalProperties: false
      properties:
        color:
          format: int32
          maximum: 16777215
          minimum: 0
          type: integer
        name:
          maxLength: 100
          minLength: 1
          type: string
        permissions:
          format: int64
          minimum: 0
          type: integer
        position:
          format: int32
          minimum: 1
          type: integer
        remove_color:
          type: boolean
      type: object
    UpdateProfileInputBody:
      additionalProperties: false
      properties:
        avatar_key:
          description: Chave devolvida por /users/me/avatar
          maxLength: 200
          type: string
        display_name:
          description: Vazio remove o nome de exibição
          maxLength: 32
          type: string
        remove_avatar:
          type: boolean
      type: object
    View:
      additionalProperties: false
      properties:
        avatar_url:
          description: URL temporária de leitura do avatar
          type: string
        created_at:
          format: date-time
          type: string
        display_name:
          type: string
        email:
          type: string
        id:
          description: ID Snowflake (string, pois excede 53 bits)
          type: string
        username:
          type: string
      required:
        - id
        - email
        - username
        - created_at
      type: object
  securitySchemes:
    bearerAuth:
      scheme: bearer
      type: http
    cookieAuth:
      in: cookie
      name: spook_session
      type: apiKey
info:
  title: Spook API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/auth/login:
    post:
      operationId: login
      parameters:
        - in: header
          name: User-Agent
          schema:
            type: string
        - description: Use "desktop" para receber o token no corpo
          in: header
          name: X-Spook-Client
          schema:
            description: Use "desktop" para receber o token no corpo
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionBody"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Login
      tags:
        - auth
  /api/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: Logout (encerra a sessão atual)
      tags:
        - auth
  /api/auth/register:
    post:
      operationId: register
      parameters:
        - in: header
          name: User-Agent
          schema:
            type: string
        - description: Use "desktop" para receber o token no corpo
          in: header
          name: X-Spook-Client
          schema:
            description: Use "desktop" para receber o token no corpo
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionBody"
          description: Created
          headers:
            Set-Cookie:
              schema:
                type: string
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Cadastro (já abre a sessão)
      tags:
        - auth
  /api/channels/{channel_id}:
    delete:
      operationId: deleteChannel
      parameters:
        - description: ID do canal
          in: path
          name: channel_id
          required: true
          schema:
            description: ID do canal
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: Exclui um canal ou categoria
      tags:
        - channels
    patch:
      operationId: updateChannel
      parameters:
        - description: ID do canal
          in: path
          name: channel_id
          required: true
          schema:
            description: ID do canal
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChannelInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelPayload"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: Renomeia ou reposiciona um canal
      tags:
        - channels
  /api/channels/{channel_id}/messages:
    get:
      operationId: listMessages
      parameters:
        - description: ID do canal
          in: path
          name: channel_id
          required: true
          schema:
            description: ID do canal
            type: string
        - description: Devolve mensagens com ID menor que este
          explode: false
          in: query
          name: before
          schema:
            description: Devolve mensagens com ID menor que este
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageListOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: Histórico paginado por cursor, da mais nova para a mais antiga
      tags:
        - messages
    post:
      operationId: sendMessage
      parameters:
        - description: ID do canal
          in: path
          name: channel_id
          required: true
          schema:
            description: ID do canal
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePayload"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: "Envia uma mensagem (limite: 5 a cada 5 s por canal)"
      tags:
        - messages
  /api/channels/{channel_id}/messages/{message_id}:
    delete:
      operationId: deleteMessage
      parameters:
        - description: ID do canal
          in: path
          name: channel_id
          required: true
          schema:
            description: ID do canal
            type: string
        - description: ID da mensagem
          in: path
          name: message_id
          required: true
          schema:
            description: ID da mensagem
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
