        - bearerAuth: []
      summary: Aplicação, banco, armazenamento, fila de jobs e gateway (cache de 5 s)
      tags:
        - admin
  /api/admin/users:
    get:
      operationId: adminUsers
      parameters:
        - description: Busca por texto (parte do nome/username/e-mail)
          explode: false
          in: query
          name: q
          schema:
            description: Busca por texto (parte do nome/username/e-mail)
            maxLength: 100
            type: string
        - description: Coluna de ordenação (padrão created_at)
          explode: false
          in: query
          name: sort
