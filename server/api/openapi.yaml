  /api/admin/livekit/history:
    get:
      operationId: adminLiveKitHistory
      parameters:
        - description: Janela da série
          explode: false
          in: query
          name: range
          schema:
            default: 24h
            description: Janela da série
            enum:
              - 24h
              - 7d
              - 30d
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveKitHistory"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: "Histórico do LiveKit: salas, participantes, faixas, tráfego, perda, jitter e RTT em até 300 pontos (24h: 5 min; 7d: 1 h; 30d: 1 dia; cache de 1 min)"
      tags:
