components:
  schemas:
    AvatarInputBody:
      additionalProperties: false
      properties:
        content_type:
          enum:
            - image/png
            - image/jpeg
            - image/webp
          type: string
        size:
          description: Tamanho em bytes (máx. 5 MB)
          format: int64
          maximum: 5242880
          minimum: 1
          type: integer
      required:
        - content_type
        - size
      type: object
    AvatarOutputBody:
      additionalProperties: false
      properties:
        key:
          type: string
        upload_url:
          description: URL pré-assinada para PUT; envie o Content-Type e o tamanho declarados
          type: string
      required:
        - upload_url
        - key
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    LoginInputBody:
      additionalProperties: false
      properties:
        email:
          format: email
          maxLength: 254
          type: string
        password:
          maxLength: 128
          minLength: 1
          type: string
      required:
        - email
        - password
      type: object
    RegisterInputBody:
      additionalProperties: false
      properties:
        email:
          format: email
          maxLength: 254
          type: string
        password:
          maxLength: 128
          minLength: 8
          type: string
        username:
          maxLength: 32
          minLength: 2
          pattern: ^[a-z0-9_.]{2,32}$
          patternDescription: "2 a 32 caracteres: a-z, 0-9, _ e ."
          type: string
      required:
        - email
        - username
        - password
      type: object
    SessionBody:
      additionalProperties: false
      properties:
        token:
          description: "Só é devolvido ao cliente desktop (header X-Spook-Client: desktop); a web usa o cookie httpOnly"
          type: string
        user:
          $ref: "#/components/schemas/View"
      required:
        - user
      type: object
    UpdateProfileInputBody:
      additionalProperties: false
      properties:
        avatar_key:
          description: Chave devolvida por /users/me/avatar
          maxLength: 200
          type: string
        display_name:
          description: Vazio remove o nome de exibição
          maxLength: 32
          type: string
        remove_avatar:
          type: boolean
      type: object
    View:
      additionalProperties: false
      properties:
        avatar_url:
          description: URL temporária de leitura do avatar
          type: string
        created_at:
          format: date-time
          type: string
        display_name:
          type: string
        email:
          type: string
        id:
          description: ID Snowflake (string, pois excede 53 bits)
          type: string
        username:
          type: string
      required:
        - id
        - email
        - username
        - created_at
      type: object
  securitySchemes:
    bearerAuth:
      scheme: bearer
      type: http
    cookieAuth:
      in: cookie
      name: spook_session
      type: apiKey
info:
  title: Spook API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/auth/login:
    post:
      operationId: login
      parameters:
        - in: header
          name: User-Agent
          schema:
            type: string
        - description: Use "desktop" para receber o token no corpo
          in: header
          name: X-Spook-Client
          schema:
            description: Use "desktop" para receber o token no corpo
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionBody"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Login
      tags:
        - auth
  /api/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: Logout (encerra a sessão atual)
      tags:
        - auth
  /api/auth/register:
    post:
      operationId: register
      parameters:
        - in: header
          name: User-Agent
          schema:
            type: string
        - description: Use "desktop" para receber o token no corpo
          in: header
          name: X-Spook-Client
          schema:
            description: Use "desktop" para receber o token no corpo
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionBody"
          description: Created
          headers:
            Set-Cookie:
              schema:
                type: string
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Cadastro (já abre a sessão)
      tags:
        - auth
  /api/users/me:
    get:
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/View"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: Perfil do usuário autenticado
      tags:
        - users
    patch:
      operationId: updateMe
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/View"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: Edita nome de exibição e avatar
      tags:
        - users
  /api/users/me/avatar:
    post:
      operationId: requestAvatarUpload
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvatarInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: Gera URL pré-assinada para enviar o avatar
      tags:
        - users
