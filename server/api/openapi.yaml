      tags:
        - admin
  /api/admin/servers:
    get:
      operationId: adminServers
      parameters:
        - description: Busca por texto (parte do nome/username/e-mail)
          explode: false
          in: query
          name: q
          schema:
            description: Busca por texto (parte do nome/username/e-mail)
            maxLength: 100
            type: string
        - description: Coluna de ordenação (padrão created_at)
          explode: false
          in: query
          name: sort
          schema:
            description: Coluna de ordenação (padrão created_at)
            type: string
        - explode: false
          in: query
          name: order
          schema:
            default: desc
            enum:
              - asc
              - desc
            type: string
        - explode: false
          in: query
          name: page
          schema:
            default: 1
            format: int64
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServersBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: Servidores, paginado (25 por página), com busca e ordenação
      tags:
        - admin
  /api/admin/servers/top:
    get:
      operationId: adminTopServers
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopServers"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - cookieAuth: []
        - bearerAuth: []
      summary: Os 10 servidores com mais mensagens nos últimos 7 dias (cache de 10 min)
      tags:
        - admin
  /api/admin/system:
    get:
      operationId: adminSystem
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System"
          description: OK
        "401":
          content:
            application/problem+json:
