components:
  schemas:
    AccountView:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        email:
          type: string
        provider:
          enum:
            - google
            - discord
          type: string
      required:
        - provider
        - created_at
      type: object
    AckBody:
      additionalProperties: false
      properties:
        message_id:
          description: ID da última mensagem lida. A leitura nunca regride (vale o maior ID) e é limitada à última mensagem do canal
          type: string
      required:
        - message_id
      type: object
    ActivityHeatmap:
      additionalProperties: false
      properties:
        cells:
          description: Mensagens por dia da semana (0 = domingo … 6 = sábado, UTC) e hora (0 a 23, UTC)
          items:
            items:
              format: int64
              type: integer
            type:
              - array
              - "null"
          type:
            - array
            - "null"
        days:
          description: Janela em dias (28)
          format: int64
          type: integer
        generated_at:
          format: date-time
          type: string
        total:
          format: int64
          type: integer
      required:
        - generated_at
        - days
        - total
        - cells
      type: object
    AttachmentPayload:
      additionalProperties: false
      properties:
        content_type:
          type: string
        filename:
          type: string
        height:
          description: Altura original; imagens processadas pelo job
          format: int32
          type: integer
        id:
          type: string
        size:
          format: int64
          type: integer
        thumbnail_url:
          description: Só em imagens, depois que o job de thumbnail termina (chega por MESSAGE_UPDATE)
          type: string
        url:
          description: GET pré-assinado, válido por 1 h
          type: string
        width:
          description: Largura original; imagens processadas pelo job
          format: int32
          type: integer
      required:
        - id
        - filename
        - content_type
        - size
        - url
      type: object
    AuditActorPayload:
      additionalProperties: false
      properties:
        avatar_url:
          type: string
        display_name:
          type: string
        id:
          type: string
        username:
          type: string
      required:
        - id
        - username
      type: object
    AuditEntryPayload:
      additionalProperties: false
      properties:
        action:
          description: "Ver audit.All: channel.create, member.ban, voice.mute..."
          type: string
        actor:
          $ref: "#/components/schemas/AuditActorPayload"
          description: Nulo quando a conta de quem agiu foi excluída
        changes:
          additionalProperties: {}
          description: "Detalhes (até 4 KB): target_name e o antes/depois dos campos alterados"
          type: object
        created_at:
          format: date-time
          type: string
        guild_id:
          type: string
        id:
          type: string
        reason:
          type:
            - string
            - "null"
        target_id:
          type:
            - string
            - "null"
        target_type:
          description: channel, role, member, invite ou guild
          type:
            - string
            - "null"
      required:
        - id
        - guild_id
        - actor
        - action
        - target_type
        - target_id
        - reason
        - changes
        - created_at
      type: object
    AuditListOutputBody:
      additionalProperties: false
      properties:
        entries:
          items:
            $ref: "#/components/schemas/AuditEntryPayload"
          type:
            - array
            - "null"
        has_more:
          type: boolean
      required:
        - entries
        - has_more
      type: object
    AuthorPayload:
      additionalProperties: false
      properties:
        avatar_url:
          type: string
        display_name:
          type: string
        id:
          type: string
        username:
          type: string
      required:
        - id
        - username
      type: object
    AvatarInputBody:
      additionalProperties: false
      properties:
        content_type:
          description: GIF e WebP animados são preservados
          enum:
            - image/png
            - image/jpeg
            - image/webp
            - image/gif
          type: string
        size:
          description: Tamanho em bytes (máx. 5 MB)
          format: int64
          maximum: 5242880
          minimum: 1
          type: integer
      required:
        - content_type
        - size
      type: object
    AvatarOutputBody:
      additionalProperties: false
      properties:
        key:
          type: string
        upload_url:
          description: URL pré-assinada para PUT; envie o Content-Type e o tamanho declarados
          type: string
      required:
        - upload_url
        - key
      type: object
    BanGuildMemberRequest:
      additionalProperties: false
      properties:
        reason:
          description: Motivo (opcional)
          maxLength: 512
          type: string
      type: object
    BanListOutputBody:
      additionalProperties: false
      properties:
        bans:
          items:
            $ref: "#/components/schemas/BanPayload"
          type:
            - array
            - "null"
        has_more:
          type: boolean
      required:
        - bans
        - has_more
      type: object
    BanPayload:
      additionalProperties: false
      properties:
        avatar_url:
          type: string
        banned_by:
          description: Quem baniu; nulo se a conta foi excluída
          type:
            - string
            - "null"
        banned_by_username:
          type:
            - string
            - "null"
        created_at:
          format: date-time
          type: string
        display_name:
          type: string
        guild_id:
          type: string
        reason:
          type:
            - string
            - "null"
        user_id:
          type: string
        username:
          type: string
      required:
        - guild_id
        - user_id
        - username
        - reason
        - banned_by
        - banned_by_username
        - created_at
      type: object
    Call:
      additionalProperties: false
      properties:
        caller:
          $ref: "#/components/schemas/CallCaller"
          description: Quem está ligando (CALL_RING)
        channel_id:
          type: string
        channel_name:
          description: Nome da DM em grupo, se tiver
          type: string
        expires_at:
          description: Quando o toque para (só enquanto toca)
          format: date-time
          type: string
        group:
          description: A chamada é numa DM em grupo
          type: boolean
        reason:
          description: "CALL_UPDATE e CALL_END: o que aconteceu"
          enum:
            - cancelled
            - missed
            - declined
            - answered
            - ended
          type: string
        started_at:
          format: date-time
          type: string
        started_by:
          type: string
        state:
          enum:
            - ringing
            - active
            - ended
          type: string
        user_id:
          description: "CALL_UPDATE: quem atendeu ou recusou"
          type: string
      required:
        - channel_id
        - state
        - started_by
        - started_at
        - group
      type: object
    CallAcceptResult:
      additionalProperties: false
      properties:
        call:
          $ref: "#/components/schemas/Call"
        voice:
          $ref: "#/components/schemas/TokenResponse"
      required:
        - call
        - voice
      type: object
    CallCaller:
      additionalProperties: false
      properties:
        avatar_url:
          type: string
        display_name:
          type: string
        id:
          type: string
        username:
          type: string
      required:
        - id
        - username
      type: object
    CallRoom:
      additionalProperties: false
      properties:
        cameras:
          format: int64
          type: integer
        channel:
          description: Nome do canal de voz, ou "Conversa direta" em DM
          type: string
        channel_id:
          type: string
        dm:
          type: boolean
        duration_seconds:
          format: int64
          type: integer
        people:
          description: Usernames
          items:
            type: string
          type:
            - array
            - "null"
        screens:
          format: int64
          type: integer
        server:
          description: Vazio em DM
          type: string
        started_at:
          format: date-time
          type: string
      required:
        - channel_id
        - channel
        - dm
        - people
        - cameras
        - screens
        - duration_seconds
      type: object
    Calls:
      additionalProperties: false
      properties:
        generated_at:
          format: date-time
          type: string
        rooms:
          items:
            $ref: "#/components/schemas/CallRoom"
          type:
            - array
            - "null"
        summary:
          $ref: "#/components/schemas/CallsSummary"
      required:
        - generated_at
        - summary
        - rooms
      type: object
    CallsSummary:
      additionalProperties: false
      properties:
        available:
          description: Falso se a voz (LiveKit) está desligada ou não respondeu
          type: boolean
        cameras:
          description: Câmeras ligadas
          format: int64
          type: integer
        ongoing:
          description: Chamadas em andamento
          format: int64
          type: integer
        people:
          description: Pessoas em chamadas
          format: int64
          type: integer
        reason:
          type: string
        screens:
          description: Compartilhamentos de tela
          format: int64
          type: integer
      required:
        - available
        - ongoing
        - people
        - cameras
        - screens
      type: object
    ChangePasswordInputBody:
      additionalProperties: false
      properties:
        current_password:
          maxLength: 128
          minLength: 1
          type: string
        new_password:
          maxLength: 128
          minLength: 8
          type: string
      required:
        - current_password
        - new_password
      type: object
    ChannelPayload:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        guild_id:
          type:
            - string
            - "null"
        id:
          type: string
        last_message_id:
          type:
            - string
            - "null"
        name:
          type: string
        owner_id:
          description: Dono da DM em grupo
          type: string
        parent_id:
          description: Categoria que contém o canal
          type:
            - string
            - "null"
        position:
          format: int32
          type: integer
        recipients:
          description: Participantes da DM (todos, inclusive você)
          items:
            $ref: "#/components/schemas/RecipientPayload"
          type:
            - array
            - "null"
        topic:
          description: Tópico do canal de texto (até 1024 caracteres); null = sem tópico
          type:
            - string
            - "null"
        type:
          description: 0 texto, 1 voz, 2 categoria, 3 DM, 4 DM em grupo
          format: int64
          type: integer
      required:
        - id
        - type
        - guild_id
        - parent_id
        - name
        - position
        - last_message_id
        - created_at
        - topic
      type: object
    ChannelPlacement:
      additionalProperties: false
      properties:
        id:
          type: string
        parent_id:
          description: Categoria do canal; null o deixa fora de categorias
          type:
            - string
            - "null"
        position:
          format: int32
          minimum: 0
          type: integer
      required:
        - id
        - position
        - parent_id
      type: object
    Comparison:
      additionalProperties: false
      properties:
        change_pct:
          description: Variação percentual; nulo se o período anterior foi zero
          format: double
          type:
            - number
            - "null"
        previous:
          description: Soma dos 6 dias completos anteriores a esses
          format: int64
          type: integer
        recent:
          description: Soma dos últimos 6 dias completos (sem hoje)
          format: int64
          type: integer
      required:
        - recent
        - previous
        - change_pct
      type: object
    CompleteInputBody:
      additionalProperties: false
      properties:
        username:
          maxLength: 32
          minLength: 2
          pattern: ^[a-z0-9_.]{2,32}$
          patternDescription: "2 a 32 caracteres: a-z, 0-9, _ e ."
          type: string
      required:
        - username
      type: object
    ConfirmPasswordInputBody:
      additionalProperties: false
      properties:
        password:
          maxLength: 128
          minLength: 1
          type: string
      required:
        - password
      type: object
    ConfirmPasswordOutputBody:
      additionalProperties: false
      properties:
        confirmed_until:
          description: Até quando as ações sensíveis ficam liberadas nesta sessão
          format: date-time
          type: string
      required:
        - confirmed_until
      type: object
    ContentBody:
      additionalProperties: false
      properties:
        content:
          description: 1 a 2000 caracteres (contados em runes), não só espaços
          maxLength: 2000
          minLength: 1
          type: string
      required:
        - content
      type: object
    CreateChannelInputBody:
      additionalProperties: false
      properties:
        name:
          maxLength: 100
          minLength: 1
          type: string
        parent_id:
          description: ID de uma categoria do servidor
          type: string
        position:
          description: "Padrão: ao final"
          format: int32
          minimum: 0
          type: integer
        type:
          description: 0 texto, 1 voz, 2 categoria
          enum:
            - 0
            - 1
            - 2
          format: int64
          type: integer
      required:
        - type
        - name
      type: object
    CreateGuildRequest:
      additionalProperties: false
      properties:
        name:
          maxLength: 100
          minLength: 2
          type: string
      required:
        - name
      type: object
    CreateGuildRoleRequest:
      additionalProperties: false
      properties:
        color:
          format: int32
          maximum: 16777215
          minimum: 0
          type: integer
        mentionable:
          description: Qualquer pessoa com acesso ao canal pode mencionar o cargo; padrão false
          type: boolean
        name:
          maxLength: 100
          minLength: 1
          type: string
        permissions:
          description: Bitflags; padrão 0
          format: int64
          minimum: 0
          type: integer
        position:
          description: "Padrão: 1 (logo acima do @everyone)"
          format: int32
          minimum: 1
          type: integer
      required:
        - name
      type: object
    CreateInviteRequest:
      additionalProperties: false
      properties:
        expires_in:
          description: "Segundos até expirar; padrão: não expira"
          format: int64
          maximum: 2592000
          minimum: 1
          type: integer
        max_uses:
          description: "Padrão: ilimitado"
          format: int32
          maximum: 1000000
          minimum: 1
          type: integer
      type: object
    CustomStatus:
      additionalProperties: false
      properties:
        emoji:
          maxLength: 32
          type: string
        expires_at:
          description: Instante em que o status some sozinho; ausente = não expira
          format: date-time
          type: string
        text:
          maxLength: 128
          type: string
      type: object
    DayCount:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        date:
          description: Dia em UTC (AAAA-MM-DD)
          type: string
      required:
        - date
        - count
      type: object
    DeleteInputBody:
      additionalProperties: false
      properties:
        password:
          maxLength: 128
          minLength: 1
          type: string
      required:
        - password
      type: object
    DesktopAuthorizeInputBody:
      additionalProperties: false
      properties:
        code_challenge:
          maxLength: 43
          minLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
          patternDescription: base64url(SHA-256(code_verifier)), 43 caracteres
          type: string
      required:
        - code_challenge
      type: object
    DesktopAuthorizeOutputBody:
      additionalProperties: false
      properties:
        code:
          description: Código de uso único (60 s) para o app trocar por um token
          type: string
        expires_at:
          format: date-time
          type: string
        redirect_url:
          description: Deep link spook://auth?code=... para o navegador abrir o app
          type: string
      required:
        - code
        - redirect_url
        - expires_at
      type: object
    DesktopExchangeInputBody:
      additionalProperties: false
      properties:
        code:
          maxLength: 128
          minLength: 20
          type: string
        code_verifier:
          description: "PKCE: o segredo cujo SHA-256 (base64url) foi enviado como code_challenge"
          maxLength: 128
          minLength: 43
          pattern: ^[A-Za-z0-9._~-]+$
          type: string
      required:
        - code
        - code_verifier
      type: object
    DetailPayload:
      additionalProperties: false
      properties:
        channels:
          description: Ordenados por posição
          items:
            $ref: "#/components/schemas/ChannelPayload"
          type:
            - array
            - "null"
        created_at:
          format: date-time
          type: string
        icon_key:
          type:
            - string
            - "null"
        icon_url:
          description: URL temporária de leitura do ícone
          type: string
        id:
          type: string
        is_owner:
          type: boolean
        my_role_ids:
          items:
            type: string
          type:
            - array
            - "null"
        name:
          type: string
        owner_id:
          type: string
        permissions:
          description: Minhas permissões efetivas (bitflags)
          format: int64
          type: integer
        roles:
          description: Do mais alto para o mais baixo
          items:
            $ref: "#/components/schemas/RolePayload"
          type:
            - array
            - "null"
        system_channel_id:
          description: Canal das mensagens de entrada; null = o primeiro canal de texto
          type:
            - string
            - "null"
        system_join_enabled:
          description: Mensagens de boas-vindas ligadas
          type: boolean
      required:
        - roles
        - channels
        - permissions
        - is_owner
        - my_role_ids
        - id
        - name
        - icon_key
        - owner_id
        - created_at
        - system_channel_id
        - system_join_enabled
      type: object
    DiskInfo:
      additionalProperties: false
      properties:
        free_bytes:
          description: Disponível para quem não é root
          format: int64
          minimum: 0
          type: integer
        path:
          type: string
        total_bytes:
          format: int64
          minimum: 0
          type: integer
        used_bytes:
          format: int64
          minimum: 0
          type: integer
        used_pct:
          format: double
          type: number
      required:
        - path
        - total_bytes
        - free_bytes
        - used_bytes
        - used_pct
      type: object
    EmailInputBody:
      additionalProperties: false
      properties:
        email:
          format: email
          maxLength: 254
          type: string
      required:
        - email
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    ForgotInputBody:
      additionalProperties: false
      properties:
        email:
          format: email
          maxLength: 254
          type: string
      required:
        - email
      type: object
    FriendInviteResult:
      additionalProperties: false
      properties:
        channel_id:
          description: DM onde a mensagem com o link foi enviada
          type: string
        code:
          description: Código do convite usado (criado ou reaproveitado)
          type: string
        message_id:
          type: string
      required:
        - channel_id
        - message_id
        - code
      type: object
    GatewayHistory:
      additionalProperties: false
      properties:
        bucket_seconds:
          format: int64
          type: integer
        collecting:
          type: boolean
        generated_at:
          format: date-time
          type: string
        points:
          items:
            $ref: "#/components/schemas/GatewayPoint"
          maxItems: 300
          type:
            - array
            - "null"
      required:
        - generated_at
        - bucket_seconds
        - collecting
        - points
      type: object
    GatewayPoint:
      additionalProperties: false
      properties:
        connections:
          description: Máximo do balde
          format: int64
          type: integer
        online_users:
          description: Máximo do balde
          format: int64
          type: integer
        ts:
          format: date-time
          type: string
      required:
        - ts
        - online_users
        - connections
      type: object
    GetMyChannelPermissionsResponse:
      additionalProperties: false
      properties:
        permissions:
          description: Bitflags efetivos no canal
          format: int64
          type: integer
      required:
        - permissions
      type: object
    GuildPayload:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        icon_key:
          type:
            - string
            - "null"
        icon_url:
          description: URL temporária de leitura do ícone
          type: string
        id:
          type: string
        name:
          type: string
        owner_id:
          type: string
        system_channel_id:
          description: Canal das mensagens de entrada; null = o primeiro canal de texto
          type:
            - string
            - "null"
        system_join_enabled:
          description: Mensagens de boas-vindas ligadas
          type: boolean
      required:
        - id
        - name
        - icon_key
        - owner_id
        - created_at
        - system_channel_id
        - system_join_enabled
      type: object
    GuildReadStatePayload:
      additionalProperties: false
      properties:
        guild_id:
          type: string
        mention_count:
          format: int64
          type: integer
        unread_count:
          description: Soma dos canais, limitada a 100 (100 = 100 ou mais)
          format: int64
          type: integer
      required:
        - guild_id
        - unread_count
        - mention_count
      type: object
    HistoryPoint:
      additionalProperties: false
      properties:
        bytes_in:
          description: Tráfego de entrada no balde
          format: double
          type: number
        bytes_out:
          description: Tráfego de saída no balde
          format: double
          type: number
        bytes_out_per_sec:
          description: Média do balde
          format: double
          type: number
        has_media:
          description: Falso se o Prometheus do LiveKit não respondeu em nenhuma amostra do balde
          type: boolean
        jitter_ms:
          description: Média do balde
          format: double
          type:
            - number
            - "null"
        packet_loss_pct:
          description: Pior perda do balde
          format: double
          type:
            - number
            - "null"
        packets_per_sec:
          format: double
          type: number
        participants:
          description: Participantes (máximo do balde)
          format: int64
          type: integer
        peak_out_per_sec:
          description: Maior ritmo de saída entre duas amostras do balde
          format: double
          type: number
        rooms:
          description: Salas (máximo do balde)
          format: int64
          type: integer
        rtt_ms:
          description: Média do balde
          format: double
          type:
            - number
            - "null"
        tracks_published:
          format: int64
          type: integer
        tracks_subscribed:
          format: int64
          type: integer
        ts:
          description: Início do balde (UTC)
          format: date-time
          type: string
      required:
        - ts
        - rooms
        - participants
        - tracks_published
        - tracks_subscribed
        - bytes_out
        - bytes_in
        - bytes_out_per_sec
        - peak_out_per_sec
