name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10" # mesma versão do toolchain em server/go.mod, do Dockerfile.server-dev e de deploy/Dockerfile
          cache-dependency-path: server/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: server
      - run: go test ./...
      - run: go build -o bin/spook ./cmd/spook
      - name: OpenAPI sem drift (server/api/openapi.yaml)
        run: go run ./cmd/spook openapi | diff -u api/openapi.yaml -
      - name: sqlc sem drift
        run: |
          docker run --rm -v "$PWD":/src -w /src sqlc/sqlc:1.31.1 generate
          git diff --exit-code -- .

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Client da API (orval) sem drift
        run: |
          pnpm --filter @spook/shared generate
          git diff --exit-code -- packages/shared
      # O @spook/desktop (Tauri/Rust) fica de fora: seus instaladores saem do workflow desktop.yml.
      - run: pnpm turbo run lint test build --filter='!@spook/server' --filter='!@spook/desktop'

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sobe Postgres e Garage
        run: |
          cp .env.example .env
          docker compose --env-file .env -f deploy/docker-compose.yml up -d --wait postgres garage
          deploy/garage-init.sh
      - name: Testes de integração (banco, storage, auth)
        run: scripts/test-integration.sh
      - name: Derruba a infra
        if: always()
        run: docker compose --env-file .env -f deploy/docker-compose.yml down -v

  e2e:
    # RNF06: fluxo crítico no navegador, contra o build de produção do front servido pelo backend.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spook
          POSTGRES_PASSWORD: spook
          POSTGRES_DB: spook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spook -d spook"
          --health-interval 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10" # mesma versão do job server
          cache-dependency-path: server/go.sum
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build do front e do backend
        run: |
          pnpm --filter @spook/web build
          cd server && go build -o bin/spook ./cmd/spook
      - name: Sobe o Garage (S3 dos anexos) para o E2E
        # O E2E de anexos envia arquivos de verdade ao storage e espera o thumbnail do worker do River.
        # O navegador roda no próprio runner, então a origem do CORS é o backend em localhost:8090.
        run: |
          cp .env.example .env
          sed -i 's#^S3_CORS_ORIGINS=.*#S3_CORS_ORIGINS=http://localhost:8090#' .env
          docker compose --env-file .env -f deploy/docker-compose.yml up -d --wait garage
          deploy/garage-init.sh
      - name: Sobe o backend (serve apps/web/dist; S3 no Garage)
        env:
          SPOOK_ENV: development # cookie sem Secure: o E2E fala HTTP em localhost
          SPOOK_ADDR: ":8090"
          SPOOK_DATABASE_URL: postgres://spook:spook@localhost:5432/spook?sslmode=disable
          SPOOK_WEB_DIR: ${{ github.workspace }}/apps/web/dist
          SPOOK_PRESENCE_OFFLINE_GRACE: 2s # só o E2E: offline em 2 s em vez dos 15 s de produção
          SPOOK_AUTH_RATE_PER_MIN: "1000" # só o E2E: todas as contas saem do mesmo IP (padrão de produção: 10/min)
          NITRO_TRIAL_DAYS: "0" # só o E2E: sem o período de cortesia (padrão 14), as contas ficam no plano Grátis e o bloqueio de GIF/tela continua testável
        run: |
          S3_ENDPOINT="$(sed -n 's/^S3_ENDPOINT=//p' .env)"
          S3_REGION="$(sed -n 's/^S3_REGION=//p' .env)"
          S3_BUCKET="$(sed -n 's/^S3_BUCKET=//p' .env)"
          S3_ACCESS_KEY_ID="$(sed -n 's/^S3_ACCESS_KEY_ID=//p' .env)"
          S3_SECRET_ACCESS_KEY="$(sed -n 's/^S3_SECRET_ACCESS_KEY=//p' .env)"
          export S3_ENDPOINT S3_REGION S3_BUCKET S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY
          server/bin/spook > server.log 2>&1 &
          curl --retry 30 --retry-delay 1 --retry-connrefused -fsS http://localhost:8090/healthz
      - name: Instala o Chromium do Playwright
        run: pnpm --filter @spook/web exec playwright install --with-deps chromium
      - name: Suíte E2E
        env:
          # e2e/admin.spec.ts promove a conta do teste direto no banco (o painel /admin exige is_admin).
          E2E_PROMOTE_CMD: psql postgres://spook:spook@localhost:5432/spook -c "UPDATE users SET is_admin = true WHERE username = '{username}'"
          # GIF animado em avatar/banner exige Nitro (crop.spec.ts e profile-live-update.spec.ts concedem direto no banco).
          E2E_GRANT_CMD: psql postgres://spook:spook@localhost:5432/spook -c "INSERT INTO entitlements (id, user_id, tier, source) SELECT (extract(epoch from clock_timestamp()) * 1000000)::bigint, id, 'nitro', 'admin' FROM users WHERE username = '{username}'"
        run: pnpm --filter @spook/web e2e
      - name: Derruba o Garage
        if: always()
        run: docker compose --env-file .env -f deploy/docker-compose.yml down -v
      - name: Relatório, traces e log do servidor (só em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostico
          path: |
            apps/web/e2e/report
            apps/web/e2e/test-results
            server.log
          retention-days: 7
