name: Desktop

# Instaladores do app desktop (Tauri 2) para Windows, macOS e Linux. Independente do deploy do backend:
# o deploy.yml não depende deste workflow. Sem assinatura de código do SO (ver apps/desktop/README.md), mas os
# bundles de atualização são ASSINADOS com a chave do updater (secrets TAURI_SIGNING_PRIVATE_KEY e
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD) e o release rascunho leva o latest.json que o app consulta.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/desktop.yml"
    tags: ["desktop-v*"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os_name }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # A 1ª build (sem cache) compila o libwebrtc/LiveKit SDK, cpal, scap e nokhwa além do Tauri: pode passar de 40 min.
    timeout-minutes: 90
    # macOS x64 é cross-compilado no runner arm64: se falhar, não derruba as demais plataformas.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os_name: windows
            arch: x64
            bundles: nsis
            target: ""
          - runner: macos-latest
            os_name: macos
            arch: arm64
            bundles: app,dmg
            target: aarch64-apple-darwin
          - runner: macos-latest
            os_name: macos
            arch: x64
            bundles: app,dmg
            target: x86_64-apple-darwin
            experimental: true
          # 24.04 (e não 22.04): o `scap` usa pipewire-rs 0.8, que exige libpipewire/libspa >= 0.3.5x (a 22.04 tem
          # 0.3.48 e a build falha em libspa-sys). Efeito: o .deb/AppImage exigem glibc >= 2.39 (Ubuntu 24.04+,
          # Debian 13+, Fedora 40+).
          - runner: ubuntu-24.04
            os_name: linux
            arch: x64
            bundles: deb,appimage
            target: ""
    env:
      # AppImage sem FUSE (runners e contêineres não têm).
      APPIMAGE_EXTRACT_AND_RUN: "1"
      CARGO_TERM_COLOR: never
      # Menos mensagens e builds mais enxutas (a CI não precisa de debuginfo).
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.os_name }}-${{ matrix.arch }}
      - name: Dependências do sistema (Linux)
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          # Tauri (webkit/gtk/tray/keyring) + voz nativa: ALSA (cpal), PipeWire/SPA e GBM/DRM/X11 (scap e o
          # captor de tela do libwebrtc), V4L2 (nokhwa), glib/gio (headers do webrtc-sys).
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev libdbus-1-dev patchelf build-essential curl wget file gnupg \
            libasound2-dev libpipewire-0.3-dev libspa-0.2-dev libgbm-dev libdrm-dev libv4l-dev \
            libxcb1-dev libxcb-shm0-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev \
            libx11-dev libxext-dev libxrandr-dev libxdamage-dev libxfixes-dev libxcomposite-dev libxtst-dev \
            protobuf-compiler
      - name: Clang 21 (Linux)
        if: matrix.os_name == 'linux'
        run: |
          # O libwebrtc é compilado com o libc++ "hermético" do Chromium e o webrtc-sys exige clang >= 21 (o
          # clang do Ubuntu 24.04 é o 18). O bindgen (libspa-sys) também usa o libclang.
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm21.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-21 libclang-21-dev
          {
            echo "CC=clang-21"
            echo "CXX=clang++-21"
            echo "LIBCLANG_PATH=/usr/lib/llvm-21/lib"
          } >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Versão do package.json igual à do Cargo.toml
        run: |
          pkg="$(node -p "require('./apps/desktop/package.json').version")"
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' apps/desktop/src-tauri/Cargo.toml | head -n1)"
          echo "package.json=$pkg Cargo.toml=$crate"
          [ "$pkg" = "$crate" ] || { echo "::error::versões diferentes: sincronize package.json e Cargo.toml"; exit 1; }
      - name: Build do desktop
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
          # Assina os bundles de atualização (.sig). Sem o secret (ex.: fork) a build segue sem eles.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          args=(--bundles "$BUNDLES")
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY ausente: a build não gera os bundles assinados do updater."
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > apps/desktop/src-tauri/no-updater.conf.json
            args+=(--config src-tauri/no-updater.conf.json)
          fi
          pnpm --filter @spook/desktop tauri build "${args[@]}"
      - name: Renomeia para Spook-<versão>-<so>-<arquitetura>
        env:
          TARGET: ${{ matrix.target }}
          OS_NAME: ${{ matrix.os_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          root=apps/desktop/src-tauri/target
          if [ -n "$TARGET" ]; then bundle="$root/$TARGET/release/bundle"; else bundle="$root/release/bundle"; fi
          mkdir -p installers
          shopt -s nullglob
          # Instaladores (.exe, .dmg, .deb, .AppImage) e artefatos do updater (.app.tar.gz no macOS) com suas
          # assinaturas (.sig); o .exe e o .AppImage são, ao mesmo tempo, instalador e pacote de atualização.
          for f in "$bundle"/nsis/*.exe "$bundle"/nsis/*.exe.sig "$bundle"/dmg/*.dmg "$bundle"/deb/*.deb \
            "$bundle"/appimage/*.AppImage "$bundle"/appimage/*.AppImage.sig \
            "$bundle"/macos/*.app.tar.gz "$bundle"/macos/*.app.tar.gz.sig; do
            case "$f" in
              *.app.tar.gz.sig) ext="app.tar.gz.sig" ;;
              *.app.tar.gz) ext="app.tar.gz" ;;
              *.exe.sig) ext="exe.sig" ;;
              *.AppImage.sig) ext="AppImage.sig" ;;
              *) ext="${f##*.}" ;;
            esac
            out="installers/Spook-${version}-${OS_NAME}-${ARCH}.${ext}"
            cp "$f" "$out"
            echo "$f -> $out"
          done
          [ -n "$(ls installers)" ] || { echo "::error::nenhum instalador encontrado em $bundle"; find "$root" -maxdepth 4 -type d -name bundle; exit 1; }
          # SHA-256 de cada instalador (os binários não têm assinatura de código do SO: o usuário pode conferir o hash).
          node -e '
            const fs = require("fs"), c = require("crypto");
            for (const f of fs.readdirSync("installers")) {
              if (f.endsWith(".sig") || f.endsWith(".sha256")) continue;
              const h = c.createHash("sha256").update(fs.readFileSync("installers/" + f)).digest("hex");
              fs.writeFileSync("installers/" + f + ".sha256", h + "  " + f + "\n");
            }'
          ls -la installers
      - uses: actions/upload-artifact@v4
        with:
          name: spook-desktop-${{ matrix.os_name }}-${{ matrix.arch }}
          path: installers/*
          if-no-files-found: error
          retention-days: 14

  updater-manifest:
    # Testa (sem build) a lógica que gera o latest.json do updater.
    name: latest.json (teste)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test apps/desktop/scripts/make-latest-json.test.mjs

  release:
    # Só em tags desktop-v*: cria um release RASCUNHO com os instaladores (a publicação é manual).
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: spook-desktop-*
          path: installers
          merge-multiple: true
      - name: Tag igual à versão do app
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg="$(node -p "require('./apps/desktop/package.json').version")"
          [ "$TAG" = "desktop-v$pkg" ] || { echo "::error::a tag $TAG não bate com a versão $pkg do package.json"; exit 1; }
      - name: Gera o latest.json do updater
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg="$(node -p "require('./apps/desktop/package.json').version")"
          # Sem os .sig (secret ausente) não há como atualizar: o release sai só com os instaladores.
          if ls installers/*.sig >/dev/null 2>&1; then
            node apps/desktop/scripts/make-latest-json.mjs --dir installers --version "$pkg" --tag "$TAG" \
              --repo "$GITHUB_REPOSITORY" --notes "Spook desktop $pkg"
          else
            echo "::warning::nenhum .sig: latest.json não foi gerado (o app não receberá esta versão como atualização)"
          fi
      - name: Cria o release rascunho
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la installers
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" installers/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" installers/* --draft --verify-tag --repo "$GITHUB_REPOSITORY" \
              --title "Spook ${TAG#desktop-v}" \
              --notes "Instaladores do Spook desktop. Sem assinatura de código: o Windows (SmartScreen) e o macOS (Gatekeeper) vão avisar na primeira abertura; veja apps/desktop/README.md. Confira o SHA-256 nos arquivos .sha256. O latest.json é o manifesto do atualizador automático: só passa a valer quando este rascunho for PUBLICADO."
          fi
