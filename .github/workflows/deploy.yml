name: Deploy

# Push na main: CI -> build da imagem (GHCR) -> deploy por SSH no VPS.
# workflow_dispatch com image_tag: redeploy/rollback de uma tag já publicada (sem CI nem build).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag já publicada no GHCR para redeploy/rollback (vazio = build do commit atual)"
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    if: ${{ inputs.image_tag == '' }}
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    if: ${{ inputs.image_tag == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Nome da imagem (GHCR exige minúsculas)
        id: ref
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/spook:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${owner}/spook:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          build-args: SPOOK_COMMIT=${{ github.sha }}
          push: true
          tags: |
            ${{ steps.ref.outputs.image }}
            ${{ steps.ref.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Roda após o build, ou direto quando é um redeploy/rollback de tag existente.
    if: ${{ always() && !cancelled() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.image_tag != '')) }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://spook.dottadigital.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve a imagem
        id: image
        env:
          BUILT_IMAGE: ${{ needs.build.outputs.image }}
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$BUILT_IMAGE" ]; then
            image="$BUILT_IMAGE"
          else
            case "$INPUT_TAG" in *[!A-Za-z0-9._-]*|"") echo "tag inválida: $INPUT_TAG" >&2; exit 1;; esac
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/spook:${INPUT_TAG}"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Imagem: $image"

      - name: Prepara o SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          : "${SSH_HOST:?secret SSH_HOST ausente}" "${SSH_USER:?secret SSH_USER ausente}" \
            "${SSH_PRIVATE_KEY:?secret SSH_PRIVATE_KEY ausente}" "${SSH_KNOWN_HOSTS:?secret SSH_KNOWN_HOSTS ausente}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONF
          Host vps
            HostName ${SSH_HOST}
            User ${SSH_USER}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 20
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 4
          CONF

      # A chave de CI só aceita 3 comandos (ci-entry.sh no servidor); qualquer outro sai com 126.
      # Cada passo repete a conexão se der timeout (ver .github/scripts/ssh-retry.sh).
      - name: receive-deploy (envia deploy/ para /srv/spook/prod/deploy)
        run: |
          tar -C deploy -cz . > "$RUNNER_TEMP/deploy.tgz"
          .github/scripts/ssh-retry.sh "$RUNNER_TEMP/deploy.tgz" receive-deploy

      - name: write-env (grava /srv/spook/prod/.env, 600)
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GARAGE_RPC_SECRET: ${{ secrets.GARAGE_RPC_SECRET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          ADMIN_USERNAMES: ${{ vars.ADMIN_USERNAMES }}
          # Painel /admin, capacidade (opcionais): limite mensal de tráfego do plano do LiveKit (GB), retenção do histórico (dias).
          LIVEKIT_MONTHLY_TRAFFIC_GB: ${{ vars.LIVEKIT_MONTHLY_TRAFFIC_GB }}
          LIVEKIT_SAMPLES_RETENTION_DAYS: ${{ vars.LIVEKIT_SAMPLES_RETENTION_DAYS }}
          # E-mail e login social: todos opcionais (sem SMTP_HOST o app sobe em modo degradado).
          SPOOK_SECRET_KEY: ${{ secrets.SPOOK_SECRET_KEY }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          REQUIRE_EMAIL_VERIFICATION: ${{ vars.REQUIRE_EMAIL_VERIFICATION || 'false' }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          # Limites de domínio e de taxa: todos opcionais (Variables do GitHub; vazio = padrão do SPEC).
          LIMIT_GUILDS_PER_USER: ${{ vars.LIMIT_GUILDS_PER_USER }}
          LIMIT_CHANNELS_PER_GUILD: ${{ vars.LIMIT_CHANNELS_PER_GUILD }}
          LIMIT_MEMBERS_PER_GUILD: ${{ vars.LIMIT_MEMBERS_PER_GUILD }}
          LIMIT_ROLES_PER_GUILD: ${{ vars.LIMIT_ROLES_PER_GUILD }}
          LIMIT_INVITES_PER_GUILD: ${{ vars.LIMIT_INVITES_PER_GUILD }}
          LIMIT_ATTACHMENT_MB: ${{ vars.LIMIT_ATTACHMENT_MB }}
          EVERYONE_PUSH_MAX: ${{ vars.EVERYONE_PUSH_MAX }}
          AUDIT_RETENTION_DAYS: ${{ vars.AUDIT_RETENTION_DAYS }}
          ADMIN_DISK_PATH: ${{ vars.ADMIN_DISK_PATH }}
          RATELIMIT_MESSAGES_SEND_PER_MIN: ${{ vars.RATELIMIT_MESSAGES_SEND_PER_MIN }}
          RATELIMIT_DMS_OPEN_PER_MIN: ${{ vars.RATELIMIT_DMS_OPEN_PER_MIN }}
          RATELIMIT_MODERATION_PER_MIN: ${{ vars.RATELIMIT_MODERATION_PER_MIN }}
          RATELIMIT_FRIENDS_REQUEST_PER_MIN: ${{ vars.RATELIMIT_FRIENDS_REQUEST_PER_MIN }}
          RATELIMIT_SOCIAL_ACTIONS_PER_MIN: ${{ vars.RATELIMIT_SOCIAL_ACTIONS_PER_MIN }}
          RATELIMIT_CALL_RING_PER_MIN: ${{ vars.RATELIMIT_CALL_RING_PER_MIN }}
          RATELIMIT_UPLOADS_REQUEST_PER_MIN: ${{ vars.RATELIMIT_UPLOADS_REQUEST_PER_MIN }}
          RATELIMIT_MESSAGES_EVERYONE_PER_MIN: ${{ vars.RATELIMIT_MESSAGES_EVERYONE_PER_MIN }}
          RATELIMIT_PUSH_PER_MIN: ${{ vars.RATELIMIT_PUSH_PER_MIN }}
          RATELIMIT_ACCOUNT_PASSWORD_PER_MIN: ${{ vars.RATELIMIT_ACCOUNT_PASSWORD_PER_MIN }}
          RATELIMIT_ACCOUNT_EMAIL_PER_MIN: ${{ vars.RATELIMIT_ACCOUNT_EMAIL_PER_MIN }}
          RATELIMIT_ACCOUNT_DELETE_PER_MIN: ${{ vars.RATELIMIT_ACCOUNT_DELETE_PER_MIN }}
          RATELIMIT_AUTH_FORGOT_PER_MIN: ${{ vars.RATELIMIT_AUTH_FORGOT_PER_MIN }}
          RATELIMIT_AUTH_RESEND_PER_MIN: ${{ vars.RATELIMIT_AUTH_RESEND_PER_MIN }}
          RATELIMIT_MAIL_RECIPIENT_PER_MIN: ${{ vars.RATELIMIT_MAIL_RECIPIENT_PER_MIN }}
          RATELIMIT_SERVERS_CREATE_PER_MIN: ${{ vars.RATELIMIT_SERVERS_CREATE_PER_MIN }}
          RATELIMIT_CHANNELS_CREATE_PER_MIN: ${{ vars.RATELIMIT_CHANNELS_CREATE_PER_MIN }}
          RATELIMIT_INVITES_CREATE_PER_MIN: ${{ vars.RATELIMIT_INVITES_CREATE_PER_MIN }}
          RATELIMIT_ROLES_MANAGE_PER_MIN: ${{ vars.RATELIMIT_ROLES_MANAGE_PER_MIN }}
          RATELIMIT_VOICE_TOKEN_PER_MIN: ${{ vars.RATELIMIT_VOICE_TOKEN_PER_MIN }}
          RATELIMIT_VOICE_WATCH_PER_MIN: ${{ vars.RATELIMIT_VOICE_WATCH_PER_MIN }}
          RATELIMIT_PROFILE_UPDATE_PER_MIN: ${{ vars.RATELIMIT_PROFILE_UPDATE_PER_MIN }}
          RATELIMIT_MESSAGES_PIN_PER_MIN: ${{ vars.RATELIMIT_MESSAGES_PIN_PER_MIN }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          GARAGE_CAPACITY: ${{ vars.GARAGE_CAPACITY || '50GB' }}
          LIVEKIT_NODE_IP: ${{ vars.LIVEKIT_NODE_IP || '187.127.26.46' }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT || 'https://spook-files.dottadigital.com' }}
          S3_CORS_ORIGINS: ${{ vars.S3_CORS_ORIGINS || 'https://spook.dottadigital.com,tauri://localhost,http://tauri.localhost' }}
        run: |
          : "${POSTGRES_PASSWORD:?}" "${GARAGE_RPC_SECRET:?}" "${S3_ACCESS_KEY_ID:?}" "${S3_SECRET_ACCESS_KEY:?}" \
            "${LIVEKIT_API_KEY:?}" "${LIVEKIT_API_SECRET:?}" "${CLOUDFLARE_TUNNEL_TOKEN:?}"
          umask 077
          {
            printf 'POSTGRES_USER=spook\nPOSTGRES_DB=spook\nPOSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'GARAGE_RPC_SECRET=%s\nGARAGE_CAPACITY=%s\n' "$GARAGE_RPC_SECRET" "$GARAGE_CAPACITY"
            printf 'S3_ENDPOINT=%s\nS3_REGION=garage\nS3_BUCKET=spook\nS3_CORS_ORIGINS=%s\n' "$S3_ENDPOINT" "$S3_CORS_ORIGINS"
            printf 'S3_ACCESS_KEY_ID=%s\nS3_SECRET_ACCESS_KEY=%s\n' "$S3_ACCESS_KEY_ID" "$S3_SECRET_ACCESS_KEY"
            printf 'LIVEKIT_API_KEY=%s\nLIVEKIT_API_SECRET=%s\nLIVEKIT_NODE_IP=%s\n' "$LIVEKIT_API_KEY" "$LIVEKIT_API_SECRET" "$LIVEKIT_NODE_IP"
            # Web Push (Fase 6b): opcionais; sem os três o push fica desligado (os endpoints respondem 503).
            printf 'VAPID_PUBLIC_KEY=%s\nVAPID_PRIVATE_KEY=%s\nVAPID_SUBJECT=%s\n' "$VAPID_PUBLIC_KEY" "$VAPID_PRIVATE_KEY" "$VAPID_SUBJECT"
            # Painel /admin: usernames promovidos a administrador no boot (Variable, não é segredo); vazio = ninguém.
            printf 'ADMIN_USERNAMES=%s\n' "$ADMIN_USERNAMES"
            printf 'LIVEKIT_MONTHLY_TRAFFIC_GB=%s\nLIVEKIT_SAMPLES_RETENTION_DAYS=%s\n' "$LIVEKIT_MONTHLY_TRAFFIC_GB" "$LIVEKIT_SAMPLES_RETENTION_DAYS"
            # E-mail e login social (opcionais; vazio = desligado)
            printf 'PUBLIC_URL=%s\nSPOOK_SECRET_KEY=%s\n' "$PUBLIC_URL" "$SPOOK_SECRET_KEY"
            printf 'SMTP_HOST=%s\nSMTP_PORT=%s\nSMTP_USER=%s\nSMTP_PASSWORD=%s\nSMTP_FROM=%s\n' "$SMTP_HOST" "$SMTP_PORT" "$SMTP_USER" "$SMTP_PASSWORD" "$SMTP_FROM"
            printf 'REQUIRE_EMAIL_VERIFICATION=%s\n' "$REQUIRE_EMAIL_VERIFICATION"
            printf 'GOOGLE_CLIENT_ID=%s\nGOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET"
            printf 'DISCORD_CLIENT_ID=%s\nDISCORD_CLIENT_SECRET=%s\n' "$DISCORD_CLIENT_ID" "$DISCORD_CLIENT_SECRET"
            # Limites opcionais (vazio = padrão): só grava as definidas.
            for n in LIMIT_GUILDS_PER_USER LIMIT_CHANNELS_PER_GUILD LIMIT_MEMBERS_PER_GUILD LIMIT_ROLES_PER_GUILD LIMIT_INVITES_PER_GUILD LIMIT_ATTACHMENT_MB EVERYONE_PUSH_MAX AUDIT_RETENTION_DAYS ADMIN_DISK_PATH RATELIMIT_MESSAGES_SEND_PER_MIN RATELIMIT_DMS_OPEN_PER_MIN RATELIMIT_MODERATION_PER_MIN RATELIMIT_FRIENDS_REQUEST_PER_MIN RATELIMIT_SOCIAL_ACTIONS_PER_MIN RATELIMIT_CALL_RING_PER_MIN RATELIMIT_UPLOADS_REQUEST_PER_MIN RATELIMIT_MESSAGES_EVERYONE_PER_MIN RATELIMIT_PUSH_PER_MIN RATELIMIT_ACCOUNT_PASSWORD_PER_MIN RATELIMIT_ACCOUNT_EMAIL_PER_MIN RATELIMIT_ACCOUNT_DELETE_PER_MIN RATELIMIT_AUTH_FORGOT_PER_MIN RATELIMIT_AUTH_RESEND_PER_MIN RATELIMIT_MAIL_RECIPIENT_PER_MIN RATELIMIT_SERVERS_CREATE_PER_MIN RATELIMIT_CHANNELS_CREATE_PER_MIN RATELIMIT_INVITES_CREATE_PER_MIN RATELIMIT_ROLES_MANAGE_PER_MIN RATELIMIT_VOICE_TOKEN_PER_MIN RATELIMIT_VOICE_WATCH_PER_MIN RATELIMIT_PROFILE_UPDATE_PER_MIN RATELIMIT_MESSAGES_PIN_PER_MIN; do
              [ -z "${!n}" ] || printf '%s=%s\n' "$n" "${!n}"
            done
            printf 'CLOUDFLARE_TUNNEL_TOKEN=%s\n' "$CLOUDFLARE_TUNNEL_TOKEN"
          } > "$RUNNER_TEMP/env"
          .github/scripts/ssh-retry.sh "$RUNNER_TEMP/env" write-env

      - name: deploy (pull da imagem e sobe a stack)
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Valida igual ao ci-entry.sh, para falhar aqui com mensagem clara em vez de exit 126 no servidor.
          [[ "$IMAGE" =~ ^ghcr\.io/[a-z0-9][a-z0-9._-]*/spook:[A-Za-z0-9._-]+$ ]] || { echo "imagem fora do padrão aceito: $IMAGE" >&2; exit 1; }
          [[ "$GHCR_USER" =~ ^[A-Za-z0-9]+$ ]] || { echo "usuário '$GHCR_USER' não é alfanumérico (exigência do ci-entry.sh)" >&2; exit 1; }
          umask 077
          # Sempre envia o token (deploy normal e rollback), para o pull não depender do cache do servidor.
          printf '%s' "$GHCR_TOKEN" > "$RUNNER_TEMP/ghcr_token"
          .github/scripts/ssh-retry.sh "$RUNNER_TEMP/ghcr_token" "deploy $IMAGE $GHCR_USER"

      - name: Remove arquivos temporários com segredos
        if: always()
        run: rm -f "$RUNNER_TEMP/env" "$RUNNER_TEMP/ghcr_token" "$RUNNER_TEMP/deploy.tgz" ~/.ssh/deploy_key

      - name: Confere /healthz em produção
        run: |
          for i in $(seq 1 12); do
            body="$(curl -fsS --max-time 10 "$PUBLIC_URL/healthz" || true)"
            if [ "$body" = '{"status":"ok"}' ]; then echo "OK: $PUBLIC_URL/healthz -> $body"; exit 0; fi
            echo "tentativa $i: '$body'"; sleep 5
          done
          echo "healthz não respondeu ok em $PUBLIC_URL (túnel/DNS configurados?)" >&2
          exit 1
